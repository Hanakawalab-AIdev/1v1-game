<script>
// ---- js/audio.js
// audio.js — fully synthesized audio (Web Audio). No audio files → nothing can go missing.
// SFX are short oscillator/noise envelopes; music is a small look-ahead step sequencer.
(function (root) {
  'use strict';
  const SG = root.SG;

  let ctx = null;
  let master, musicBus, sfxBus, musicDuck, noiseBuf;
  let vol = { music: 0.6, sfx: 0.8, mute: false };
  let ducked = false;
  let wantTrack = null;
  let track = null;
  let step = 0;
  let nextTime = 0;
  let timer = null;
  const lastPlayed = Object.create(null);
  let voices = 0;
  const MAX_VOICES = 24;

  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  const nm = (s) => {
    const m = /^([A-G]#?)(\d)$/.exec(s);
    return m ? 12 * (+m[2] + 1) + NOTE[m[1]] : null;
  };

  function ensure() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return true;
    }
    const AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC();
    } catch (e) {
      return false;
    }
    master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.ratio.value = 4;
    master.connect(comp).connect(ctx.destination);
    musicBus = ctx.createGain();
    musicDuck = ctx.createGain();
    sfxBus = ctx.createGain();
    musicBus.connect(musicDuck).connect(master);
    sfxBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    const rng = SG.makeRng(99);
    for (let i = 0; i < d.length; i++) d[i] = rng() * 2 - 1;
    applyVolumes();
    if (wantTrack) startTrack(wantTrack);
    return true;
  }

  function applyVolumes() {
    if (!ctx) return;
    const now = ctx.currentTime;
    const m = vol.mute ? 0 : 1;
    master.gain.setTargetAtTime(m, now, 0.02);
    musicBus.gain.setTargetAtTime(vol.music * 0.55, now, 0.05);
    sfxBus.gain.setTargetAtTime(vol.sfx * 0.9, now, 0.02);
    musicDuck.gain.setTargetAtTime(ducked ? 0.3 : 1, now, 0.1);
  }

  function voice(end) {
    voices++;
    setTimeout(() => { voices--; }, Math.max(10, (end - ctx.currentTime) * 1000 + 50));
  }

  function panNode(dest, pan) {
    if (!pan || !ctx.createStereoPanner) return dest;
    const p = ctx.createStereoPanner();
    p.pan.value = pan;
    p.connect(dest);
    return p;
  }

  // Tone with pitch sweep and ADSR-ish envelope.
  function tone(o) {
    const t0 = (o.at || ctx.currentTime) + (o.delay || 0);
    const dur = o.dur || 0.1;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    const v = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(panNode(o.dest || sfxBus, o.pan));
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
    voice(t0 + dur);
  }

  function noise(o) {
    const t0 = (o.at || ctx.currentTime) + (o.delay || 0);
    const dur = o.dur || 0.1;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.freq || 1200, t0);
    if (o.freq1) f.frequency.exponentialRampToValueAtTime(o.freq1, t0 + dur);
    f.Q.value = o.q || 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.vol === undefined ? 0.2 : o.vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(panNode(o.dest || sfxBus, o.pan));
    src.start(t0, Math.random() * 0.5);
    src.stop(t0 + dur + 0.02);
    voice(t0 + dur);
  }

  const panFor = (who) => (who === 0 ? -0.35 : who === 1 ? 0.35 : 0);

  // name → [minimum interval in ms (per player), play function]
  const SFX = {
    menuMove: [35, () => tone({ type: 'square', f0: 620, dur: 0.05, vol: 0.06 })],
    select: [60, () => { tone({ type: 'square', f0: 660, dur: 0.06, vol: 0.08 }); tone({ type: 'square', f0: 990, dur: 0.09, vol: 0.08, delay: 0.05 }); }],
    back: [60, () => { tone({ type: 'square', f0: 520, f1: 330, dur: 0.1, vol: 0.07 }); }],
    start: [200, () => { [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.12, vol: 0.08, delay: i * 0.06 })); }],
    pause: [100, () => { tone({ type: 'triangle', f0: 880, dur: 0.08, vol: 0.15 }); tone({ type: 'triangle', f0: 660, dur: 0.12, vol: 0.15, delay: 0.07 }); }],
    resume: [100, () => { tone({ type: 'triangle', f0: 660, dur: 0.08, vol: 0.15 }); tone({ type: 'triangle', f0: 880, dur: 0.12, vol: 0.15, delay: 0.07 }); }],
    count: [300, () => { tone({ type: 'square', f0: 440, dur: 0.16, vol: 0.12 }); tone({ type: 'sine', f0: 880, dur: 0.16, vol: 0.06 }); }],
    go: [300, () => { tone({ type: 'square', f0: 880, dur: 0.35, vol: 0.12 }); tone({ type: 'square', f0: 1320, dur: 0.35, vol: 0.06 }); noise({ dur: 0.25, vol: 0.08, filter: 'highpass', freq: 3000 }); }],
    jump: [40, (o) => tone({ type: 'square', f0: 280, f1: 560, dur: 0.11, vol: 0.07, pan: panFor(o.who) })],
    land: [70, (o) => noise({ dur: 0.07 + Math.min(o.speed || 0, 14) * 0.004, vol: 0.05 + Math.min(o.speed || 0, 14) * 0.008, freq: 900, freq1: 200, pan: panFor(o.who) })],
    bump: [140, () => { tone({ type: 'triangle', f0: 160, f1: 90, dur: 0.08, vol: 0.18 }); }],
    stomp: [60, (o) => {
      const p = panFor(o.who);
      noise({ dur: 0.18, vol: 0.3, freq: 2500, freq1: 300, pan: p });
      tone({ type: 'square', f0: 220, f1: 70, dur: 0.22, vol: 0.2, pan: p });
      tone({ type: 'sine', f0: 1200, f1: 1800, dur: 0.12, vol: 0.12, delay: 0.03, pan: p });
    }],
    score: [100, (o) => { const p = panFor(o.who); tone({ type: 'square', f0: 988, dur: 0.07, vol: 0.09, delay: 0.08, pan: p }); tone({ type: 'square', f0: 1319, dur: 0.22, vol: 0.09, delay: 0.15, pan: p }); }],
    matchPoint: [100, (o) => { const p = panFor(o.who); [988, 1319, 1568].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.12, vol: 0.09, delay: 0.08 + i * 0.07, pan: p })); }],
    respawn: [100, () => { [523, 659, 784].forEach((f, i) => tone({ type: 'sine', f0: f, dur: 0.1, vol: 0.06, delay: i * 0.04 })); }],
    suddenDeath: [500, () => { for (let i = 0; i < 3; i++) tone({ type: 'sawtooth', f0: 330, f1: 660, dur: 0.18, vol: 0.08, delay: i * 0.22 }); }],
    roundWin: [300, () => { [659, 784, 988, 1319].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.14, vol: 0.09, delay: i * 0.09 })); }],
    victory: [800, () => {
      const seq = [['C5', 0, 0.12], ['E5', 0.12, 0.12], ['G5', 0.24, 0.12], ['C6', 0.36, 0.3], ['A5', 0.72, 0.12], ['B5', 0.84, 0.12], ['C6', 0.96, 0.7]];
      for (const [n, t, d] of seq) {
        tone({ type: 'square', f0: midi(nm(n)), dur: d + 0.05, vol: 0.09, delay: t });
        tone({ type: 'triangle', f0: midi(nm(n) - 12), dur: d + 0.05, vol: 0.12, delay: t });
      }
      for (const n of ['C5', 'E5', 'G5']) tone({ type: 'sine', f0: midi(nm(n)), dur: 1.0, vol: 0.06, delay: 0.96 });
      noise({ dur: 0.6, vol: 0.06, filter: 'highpass', freq: 5000, delay: 0.96 });
    }],
  };

  // ---------------------------------------------------------------- music
  // Patterns are written per 8th note: note name, '-' to hold, '.' for rest.
  const seq8 = (str) => str.trim().split(/\s+/);
  const TRACKS = {
    menu: {
      bpm: 100,
      bars: 4,
      chords: [['C4', 'E4', 'G4'], ['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4']],
      bass: ['C3', 'A2', 'F2', 'G2'],
      lead: seq8('E5 . G5 . A5 G5 E5 .  C5 . E5 . D5 C5 A4 .  A4 C5 F5 . E5 . C5 .  D5 . B4 . G4 - - .'),
      leadType: 'triangle',
      leadVol: 0.12,
      drums: false,
      hat: true,
    },
    battle: {
      bpm: 148,
      bars: 8,
      chords: [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['C4', 'E4', 'G4'], ['G3', 'B3', 'D4'], ['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4'], ['E3', 'G#3', 'B3']],
      bass: ['A2', 'F2', 'C3', 'G2', 'A2', 'F2', 'G2', 'E2'],
      lead: seq8(
        'A4 . C5 E5 . D5 C5 .  A4 . F4 A4 . C5 A4 .  G4 . C5 E5 . G5 E5 .  D5 . B4 G4 . B4 D5 .' +
        '  E5 . A5 . G5 E5 . C5  F5 . E5 C5 . A4 C5 .  D5 . G5 . F5 D5 B4 .  G#4 . B4 . E5 - D5 B4'
      ),
      leadType: 'square',
      leadVol: 0.07,
      drums: true,
      hat: true,
    },
  };

  function scheduleStep(tr, s, t) {
    const spb = 60 / tr.bpm / 2; // seconds per 8th
    const per = 8;
    const bar = Math.floor(s / per) % tr.bars;
    const i = s % per;
    const dest = musicBus;
    // bass: 8th-note pulse with octave jumps
    const root = nm(tr.bass[bar]);
    const bassNote = tr.drums ? (i % 4 === 2 ? root + 12 : root) : i % 4 === 0 ? root : null;
    if (bassNote !== null) tone({ at: t, type: 'triangle', f0: midi(bassNote), dur: tr.drums ? spb * 0.9 : spb * 3.5, vol: tr.drums ? 0.22 : 0.2, dest });
    // chord arpeggio (soft)
    const ch = tr.chords[bar];
    const arpNote = nm(ch[i % 3]) + (i >= 4 ? 12 : 0);
    tone({ at: t, type: 'sine', f0: midi(arpNote), dur: spb * 0.9, vol: tr.drums ? 0.035 : 0.05, dest });
    // lead
    const li = (bar * per + i) % tr.lead.length;
    const ln = tr.lead[li];
    if (ln !== '.' && ln !== '-') {
      let len = 1;
      while (tr.lead[(li + len) % tr.lead.length] === '-' && len < 8) len++;
      tone({ at: t, type: tr.leadType, f0: midi(nm(ln)), dur: spb * len * 0.92, vol: tr.leadVol, dest, attack: 0.01 });
    }
    // drums
    if (tr.drums) {
      if (i === 0 || i === 4 || (i === 5 && bar % 2 === 1)) tone({ at: t, type: 'sine', f0: 150, f1: 45, dur: 0.14, vol: 0.4, dest });
      if (i === 2 || i === 6) noise({ at: t, dur: 0.12, vol: 0.12, filter: 'bandpass', freq: 1800, q: 0.8, dest });
    }
    if (tr.hat) noise({ at: t + (tr.drums ? 0 : spb * 0.5), dur: 0.03, vol: tr.drums ? 0.05 : 0.025, filter: 'highpass', freq: 7000, dest });
  }

  function pump() {
    if (!ctx || !track) return;
    const tr = TRACKS[track];
    const spb = 60 / tr.bpm / 2;
    if (nextTime < ctx.currentTime - 0.2) nextTime = ctx.currentTime + 0.05; // tab was in background
    while (nextTime < ctx.currentTime + 0.25) {
      scheduleStep(tr, step, nextTime);
      step++;
      nextTime += spb;
    }
  }

  function startTrack(name) {
    if (!ctx) return;
    track = name;
    step = 0;
    nextTime = ctx.currentTime + 0.08;
    if (!timer) timer = setInterval(pump, 50);
    pump();
  }

  function stopTrack() {
    track = null;
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
    if (ctx) {
      // fade out whatever is already scheduled
      const now = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setValueAtTime(musicBus.gain.value, now);
      musicBus.gain.linearRampToValueAtTime(0, now + 0.15);
      const old = musicBus;
      setTimeout(() => {
        // fresh bus so later tracks start clean
        try { old.disconnect(); } catch (e) { /* already gone */ }
      }, 300);
      musicBus = ctx.createGain();
      musicBus.connect(musicDuck);
      musicBus.gain.value = vol.music * 0.55;
    }
  }

  SG.Audio = {
    unlock: ensure,
    get ready() { return !!ctx && ctx.state === 'running'; },
    apply(settings) {
      vol = { music: settings.musicVol / 10, sfx: settings.sfxVol / 10, mute: settings.mute };
      applyVolumes();
    },
    duck(on) {
      ducked = !!on;
      applyVolumes();
    },
    music(name) {
      if (name === wantTrack && (track === name || !ctx)) return;
      wantTrack = name;
      if (!ctx) return;
      if (track) stopTrack();
      if (name) startTrack(name);
    },
    play(name, o) {
      if (!ctx || ctx.state !== 'running' || vol.mute || vol.sfx <= 0) return;
      const def = SFX[name];
      if (!def) return;
      const opt = o || {};
      const key = name + (opt.who === undefined ? '' : opt.who);
      const now = performance.now();
      if (lastPlayed[key] && now - lastPlayed[key] < def[0]) return; // prevent stacking
      if (voices > MAX_VOICES && name !== 'stomp' && name !== 'victory') return;
      lastPlayed[key] = now;
      def[1](opt);
    },
    suspend() {
      if (ctx && ctx.state === 'running') ctx.suspend();
    },
    resume() {
      if (ctx && ctx.state === 'suspended') ctx.resume();
    },
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>

// ---- js/fighter.js
// fighter.js — character art/animation and particle effects. Presentation only:
// nothing here reads input or writes simulation state, and visuals never change hitboxes
// (characters are drawn anchored to the 30x40 hitbox's feet).
(function (root) {
  'use strict';
  const SG = root.SG;

  const PAL = [
    { body: '#ea3f3a', shade: '#b4232a', light: '#ff9a87', ink: '#3a0b10', crest: '#ffb43c', crestTip: '#fff1a8', belly: '#ffd2c6', name: 'Ember' },
    { body: '#2f86ea', shade: '#1b56b0', light: '#9fd0ff', ink: '#0a1d3d', crest: '#7fe7ff', crestTip: '#e8fdff', belly: '#cfe7ff', name: 'Tide' },
  ];
  SG.PALETTE = PAL;

  // ============================================================== particles
  const MAX_PARTS = 420;
  const FX = {
    parts: [],
    shake: 0,
    flash: 0,
    flashColor: '#fff',
    ghosts: [],
    rng: SG.makeRng(12345),
    clear() {
      this.parts.length = 0;
      this.ghosts.length = 0;
      this.shake = 0;
      this.flash = 0;
    },
    add(p) {
      if (this.parts.length >= MAX_PARTS) this.parts.shift();
      this.parts.push(p);
    },
    r(a, b) { return a + (b - a) * this.rng(); },
    dust(x, y, n, spread, color) {
      for (let i = 0; i < n; i++) {
        this.add({ k: 'dot', x: x + this.r(-spread, spread), y, vx: this.r(-1.6, 1.6), vy: this.r(-1.8, -0.3), g: 0.06, life: this.r(16, 28), max: 28, size: this.r(2, 4.5), color: color || 'rgba(255,255,255,0.8)' });
      }
    },
    sideDust(x, y, dir) {
      for (let i = 0; i < 4; i++) this.add({ k: 'dot', x, y, vx: -dir * this.r(0.5, 2), vy: this.r(-1, -0.2), g: 0.05, life: 18, max: 18, size: this.r(2, 3.5), color: 'rgba(255,255,255,0.7)' });
    },
    burst(x, y, color, n, speed) {
      for (let i = 0; i < n; i++) {
        const a = this.r(0, Math.PI * 2);
        const s = this.r(speed * 0.4, speed);
        this.add({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g: 0.12, life: this.r(18, 32), max: 32, size: this.r(2, 4), color });
      }
    },
    stars(x, y, n) {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + this.r(-1.3, 1.3);
        const s = this.r(2.5, 5);
        this.add({ k: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0.15, life: this.r(28, 40), max: 40, size: this.r(5, 8), rot: this.r(0, 6), vr: this.r(-0.3, 0.3), color: '#ffe066' });
      }
    },
    ring(x, y, color, size, life) {
      this.add({ k: 'ring', x, y, vx: 0, vy: 0, g: 0, life: life || 20, max: life || 20, size: size || 40, color });
    },
    text(x, y, str, color, size) {
      this.add({ k: 'text', x, y, vx: 0, vy: -0.9, g: 0.012, life: 60, max: 60, size: size || 22, color, str });
    },
    confetti(x0, x1, y, n) {
      const cols = ['#ff5a5a', '#ffd23f', '#3fd5ff', '#7cff6b', '#ff7ae6', '#ffffff'];
      for (let i = 0; i < n; i++) {
        this.add({ k: 'conf', x: this.r(x0, x1), y: y + this.r(-60, 0), vx: this.r(-1.5, 1.5), vy: this.r(-1, 2), g: 0.05, drag: 0.98, life: this.r(120, 200), max: 200, size: this.r(4, 8), rot: this.r(0, 6), vr: this.r(-0.25, 0.25), color: cols[i % cols.length] });
      }
    },
    trail(x, y, index) {

    },
    ghost(x, y, index, facing) {

    },
    tick() {
      for (let i = this.parts.length - 1; i >= 0; i--) {
        const p = this.parts[i];
        p.vy += p.g;
        if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
        p.x += p.vx;
        p.y += p.vy;
        if (p.vr) p.rot += p.vr;
        if (--p.life <= 0) this.parts.splice(i, 1);
      }
      for (let i = this.ghosts.length - 1; i >= 0; i--) if (++this.ghosts[i].t > 34) this.ghosts.splice(i, 1);

    },
    draw(ctx) {
      for (const g of this.ghosts) drawGhost(ctx, g);
      for (const p of this.parts) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = Math.min(1, a * 1.4);

        ctx.strokeStyle = p.color;
        switch (p.k) {

          case 'spark':

          case 'ring':

  SG.FX = FX;

  function starPath(ctx, x, y, r, rot) {

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();

    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);

  // ============================================================== per-player animation state
  SG.createVis = function (index) {

  // Called once per simulation tick (presentation only).
  SG.tickVis = function (v, p, phase) {

  SG.visEvent = function (v, ev, p) {

      case 'land': {

  // ============================================================== drawing
  // (x, y) = hitbox top-left in world coordinates. Drawn anchored at feet centre.
  SG.drawFighter = function (ctx, p, v, x, y, opts) {

    const cx = x + p.w / 2;
    const by = y + p.h;
    let sy = v.sy;
    let hop = 0;
    let mood = 'normal';

      const fx = side * 8 + (air ? side * 1.5 : ph * 3.5);
      const fy = air ? -1 + (p.vy < 0 ? -3 : 2) : -2.5 - Math.max(0, ph) * 3;
      ctx.beginPath();
      ctx.ellipse(fx + f * 2, fy, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      const w = Math.sin(v.t * 0.25) * 1.5;

      ctx.quadraticCurveTo(-4, -47, -1, -46);
      ctx.quadraticCurveTo(0 - w, -58, 6, -61);
      ctx.quadraticCurveTo(5, -50, 8, -47);
      ctx.quadraticCurveTo(12 + w, -52, 13, -54);
      ctx.quadraticCurveTo(14, -44, 10, -38);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = pal.crestTip;
      ctx.beginPath();
      ctx.ellipse(2, -48, 2.5, 4, 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 2.5;
      ctx.fillStyle = pal.crest;
      ctx.beginPath();

      ctx.moveTo(-12, -38);

      ctx.bezierCurveTo(16, -48, 10, -42, 5, -45);

      ctx.fill();
      ctx.stroke();

    const bottom = -3;

    // shading

    ctx.clip();
    ctx.fillStyle = pal.shade;
    ctx.beginPath();

    ctx.fillStyle = pal.light;

    ctx.beginPath();
    ctx.ellipse(-f * 8, top + 9, 6, 4, -0.5 * f, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = pal.ink;
    roundRect(ctx, -17, top, 34, bottom - top, 15);
    ctx.stroke();

    // belly emblem (shape-coded: ▲ for P1, ● for P2 — colour-blind friendly)
    ctx.fillStyle = pal.belly;
    ctx.beginPath();
    ctx.ellipse(f * 1.5, -13, 9, 7.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pal.shade;
    if (p.index === 0) {
      ctx.beginPath();
      ctx.moveTo(f * 1.5, -18.5);
      ctx.lineTo(f * 1.5 + 5.5, -9.5);
      ctx.lineTo(f * 1.5 - 5.5, -9.5);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(f * 1.5, -13, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // face
    const ex = f * 4;
    const ey = -29 + v.eyeY;
    ctx.fillStyle = 'rgba(255,120,140,0.45)';
    ctx.beginPath();
    ctx.ellipse(ex - 10, ey + 7, 3.5, 2.2, 0, 0, Math.PI * 2);
    ctx.ellipse(ex + 10, ey + 7, 3.5, 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = pal.ink;
    ctx.fillStyle = pal.ink;
    ctx.lineCap = 'round';
    if (mood === 'happy') {
      ctx.lineWidth = 2.6;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(ex + s * 6, ey + 1.5, 3.6, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(ex, ey + 6, 4, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(ex + s * 6 - 3.5, ey);
        ctx.lineTo(ex + s * 6 + 3.5, ey);
        ctx.stroke();
      }
    } else {
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(ex + s * 6, ey, 4.6, mood === 'sad' ? 4.2 : 5.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = pal.ink;
        ctx.beginPath();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex + s * 6 + f * 1.6 + 0.9, ey - 0.6, 0.8, 0, Math.PI * 2);

        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(ex - 10, ey - 8); ctx.lineTo(ex - 3, ey - 5.5);
        ctx.moveTo(ex + 10, ey - 8); ctx.lineTo(ex + 3, ey - 5.5);
        ctx.stroke();

        ctx.beginPath();

        ctx.beginPath();

        ctx.beginPath();
        ctx.arc(ex, ey + 6.5, 2.6, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

    ctx.restore();
  };

  // Squashed "pancake" left behind where a fighter was stomped (then poofs).
  function drawGhost(ctx, g) {

<script>
// ---- js/render.js
// render.js — camera, stage art, world rendering, HUD and debug overlay.
// Pure presentation: reads world state, never modifies it.
(function (root) {
  'use strict';
  const SG = root.SG;
  const C = SG.C;
  const VW = C.VIEW_W;
  const VH = C.VIEW_H;
  const FONT = '"Trebuchet MS", "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif';
  SG.FONT = FONT;

  // ============================================================== camera
  // World → screen: screen = (world - (x, top)) * zoom. Bottom of the view stays at world y = 400.
  SG.createCamera = function (stage) {
    const cam = { x: 0, top: 0, zoom: 1, stage };
    SG.snapCamera(cam, null);
    return cam;
  };
  function camTarget(cam, players) {
    const st = cam.stage;
    if (!st.scrolling || !players) {
      const zoom = st.scrolling ? VW / st.width : 1;
      return { zoom, cx: st.width / 2 };
    }
    let x0 = Infinity;
    let x1 = -Infinity;
    for (const p of players) {
      x0 = Math.min(x0, p.x);
      x1 = Math.max(x1, p.x + p.w);
    }
    const zoom = SG.clamp(VW / (x1 - x0 + 380), VW / st.width, 1);
    return { zoom, cx: (x0 + x1) / 2 };
  }
  function applyCam(cam, zoom, cx) {
    const st = cam.stage;
    cam.zoom = zoom;
    const viewW = VW / zoom;
    cam.x = SG.clamp(cx - viewW / 2, 0, Math.max(0, st.width - viewW));
    cam.top = VH - VH / zoom;
    cam.cx = cx;
  }
  SG.snapCamera = function (cam, players) {
    const t = camTarget(cam, players);
    applyCam(cam, t.zoom, t.cx);
  };
  // Frame-rate independent smoothing (dt in seconds). Camera never affects physics.
  SG.updateCamera = function (cam, players, dt) {
    if (!cam.stage.scrolling) return applyCam(cam, 1, cam.stage.width / 2);
    const t = camTarget(cam, players);
    const k = 1 - Math.exp(-dt * 4.5);
    const zoom = cam.zoom + (t.zoom - cam.zoom) * k;
    const cx = (cam.cx === undefined ? t.cx : cam.cx) + (t.cx - (cam.cx === undefined ? t.cx : cam.cx)) * k;
    applyCam(cam, zoom, cx);
  };

  // ============================================================== stage themes
  const THEMES = {
    meadow: {
      sky: ['#5fb8ff', '#bfe6ff', '#e8f7ff'],
      far: '#a9d9a0', mid: '#86c47c', farAmp: 50, midAmp: 30,
      ground: '#8a5a32', groundDark: '#6d4424', top: '#58b947', topLight: '#7fd86a',
      plat: '#a1673b', platDark: '#6e4123', platTop: '#5cc14c', platTopLight: '#86e070',
      mover: '#b57b47', rail: 'rgba(80,50,20,0.25)',
    },
    docks: {
      sky: ['#ff8a5c', '#ffb77a', '#ffe0a8'],
      far: '#c0627a', mid: '#8f4a6a', farAmp: 28, midAmp: 0,
      ground: '#7a4a2f', groundDark: '#55311d', top: '#a8714b', topLight: '#c98d62',
      plat: '#9a6440', platDark: '#5e3a22', platTop: '#c48a5c', platTopLight: '#e0a878',
      mover: '#8b5a36', rail: 'rgba(255,255,255,0.25)',
    },
    cavern: {
      sky: ['#140b26', '#2a1748', '#3b2160'],
      far: '#241540', mid: '#311c55', farAmp: 40, midAmp: 30,
      ground: '#3a2d52', groundDark: '#271e3a', top: '#5e4b82', topLight: '#7d68a8',
      plat: '#54467a', platDark: '#322850', platTop: '#8fe6ff', platTopLight: '#d4f7ff',
      mover: '#475a8a', rail: 'rgba(143,230,255,0.25)',
    },
    neon: {
      sky: ['#070a26', '#141a4a', '#2c1b55'],
      far: '#1a1c48', mid: '#24275f', farAmp: 0, midAmp: 0,
      ground: '#23243a', groundDark: '#17182a', top: '#ff3df5', topLight: '#ff9cf9',
      plat: '#353a66', platDark: '#1e2142', platTop: '#39f3ff', platTopLight: '#c4fcff',
      mover: '#41306e', moverTop: '#ff5cf2', rail: 'rgba(255,92,242,0.28)',

  function ridge(ctx, cam, f, baseScreenY, amp, color, seed, step) {
    // Parallax silhouette drawn in screen space; u = parallax world coordinate.
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VH);
    const z = cam.zoom;
    for (let sx = 0; sx <= VW + step; sx += step) {
      const u = (sx / z + cam.x * f) * 1;
      const h = amp * (0.55 + 0.25 * Math.sin(u * 0.011 + seed) + 0.2 * Math.sin(u * 0.027 + seed * 2.1));

  function skyline(ctx, cam, f, baseY, color, seed, windowCol, time) {
    const z = Math.max(cam.zoom, 0.6);
    const u0 = cam.x * f;
    const bw = 46 * z;

    for (let i = first; i < first + Math.ceil(VW / bw) + 3; i++) {
      const hgt = (60 + SG.hash01(i * 7 + seed) * 110) * z;
      const sx = (i * 46 - u0) * z;
      const w = bw - 4 * z;
      ctx.fillStyle = color;
      ctx.fillRect(sx, baseY - hgt, w, hgt + 2);
      if (windowCol) {
        for (let wy = 0; wy < hgt - 14 * z; wy += 12 * z) {
          for (let wx = 5 * z; wx < w - 6 * z; wx += 10 * z) {
            const hsh = SG.hash01(i * 131 + Math.round(wy) * 17 + Math.round(wx) * 3 + seed);
            if (hsh < 0.33) {
              const flick = hsh < 0.02 && Math.floor(time / 40 + i) % 3 === 0;
              ctx.fillStyle = flick ? 'rgba(0,0,0,0)' : hsh < 0.12 ? windowCol[0] : windowCol[1];
              ctx.fillRect(sx + wx, baseY - hgt + 8 * z + wy, 4 * z, 5 * z);
