  }

  // Background in screen space (behind the world transform).
  function drawBackdrop(ctx, stage, cam, time) {
    const th = THEMES[stage.def.theme];
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(0.6, th.sky[1]);
    g.addColorStop(1, th.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
    const groundScreen = (stage.groundY - cam.top) * cam.zoom;
    const theme = stage.def.theme;
    if (theme === 'meadow') {
      // sun
      const sg = ctx.createRadialGradient(660, 70, 10, 660, 70, 90);
      sg.addColorStop(0, 'rgba(255,250,210,1)');
      sg.addColorStop(0.3, 'rgba(255,240,170,0.9)');
      sg.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(560, -30, 200, 200);
      // clouds
      for (let i = 0; i < 5; i++) {
        const cx = ((i * 197 + time * (0.12 + i * 0.03)) % (VW + 200)) - 100;
        const cy = 40 + ((i * 53) % 90);
        cloud(ctx, cx, cy, 0.7 + (i % 3) * 0.2);
      }
      ridge(ctx, cam, 0.15, groundScreen - 40 * cam.zoom, th.farAmp * 2.2, th.far, 1.3, 16);
      ridge(ctx, cam, 0.4, groundScreen, th.midAmp * 2.4, th.mid, 4.1, 16);
    } else if (theme === 'docks') {
      // big setting sun on the horizon + sea
      const hz = groundScreen - 70 * cam.zoom;
      const sg = ctx.createRadialGradient(400, hz, 10, 400, hz, 180);
      sg.addColorStop(0, 'rgba(255,245,200,1)');
      sg.addColorStop(0.35, 'rgba(255,200,120,0.9)');
      sg.addColorStop(1, 'rgba(255,160,100,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(200, hz - 190, 400, 380);
      ctx.fillStyle = '#ffe9b0';
      ctx.beginPath();
      ctx.arc(400, hz, 58, Math.PI, 0);
      ctx.fill();
      ridge(ctx, cam, 0.1, hz + 2, th.farAmp, th.far, 2.2, 20);
      const sea = ctx.createLinearGradient(0, hz, 0, groundScreen);
      sea.addColorStop(0, '#d9667a');
      sea.addColorStop(1, '#6b3a73');
      ctx.fillStyle = sea;
      ctx.fillRect(0, hz, VW, groundScreen - hz + 2);
      ctx.fillStyle = 'rgba(255,230,170,0.55)';
      for (let i = 0; i < 14; i++) {
        const y = hz + 6 + i * ((groundScreen - hz) / 14);
        const w = 90 - i * 4 + Math.sin(time * 0.05 + i) * 12;
        ctx.fillRect(400 - w / 2 + Math.sin(time * 0.03 + i * 1.7) * 8, y, w, 2);
      }
      // gulls
      ctx.strokeStyle = 'rgba(60,20,40,0.6)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const gx = ((time * (0.4 + i * 0.1) + i * 260) % (VW + 100)) - 50;
        const gy = 60 + i * 30 + Math.sin(time * 0.05 + i) * 6;
        const fl = Math.sin(time * 0.2 + i) * 3;
        ctx.beginPath();
        ctx.moveTo(gx - 8, gy - fl);
        ctx.quadraticCurveTo(gx - 4, gy - 4, gx, gy);
        ctx.quadraticCurveTo(gx + 4, gy - 4, gx + 8, gy - fl);
        ctx.stroke();
      }
    } else if (theme === 'cavern') {
      // stalactites (top) and glowing crystals in the far wall
      ctx.fillStyle = th.far;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let sx = 0; sx <= VW; sx += 25) {
        const h = 20 + SG.hash01(Math.floor(sx / 25) + 3) * 50;
        ctx.lineTo(sx, 0);
        ctx.lineTo(sx + 12, h);
      }
      ctx.lineTo(VW, 0);
      ctx.fill();
      ridge(ctx, cam, 0.2, groundScreen - 20, th.farAmp * 2.5, th.far, 0.7, 14);
      ridge(ctx, cam, 0.45, groundScreen, th.midAmp * 2, th.mid, 3.3, 14);
      for (let i = 0; i < 9; i++) {
        const x = 40 + i * 92 + (i % 2) * 20;
        const y = groundScreen - 40 - SG.hash01(i + 40) * 140;
        const pulse = 0.55 + 0.45 * Math.sin(time * 0.04 + i * 1.3);
        crystal(ctx, x, y, 8 + (i % 3) * 4, i % 2 ? `rgba(255,120,220,${0.35 + pulse * 0.35})` : `rgba(120,230,255,${0.35 + pulse * 0.35})`);
      }
      // floating motes
      ctx.fillStyle = 'rgba(190,240,255,0.6)';
      for (let i = 0; i < 18; i++) {
        const x = (i * 47 + Math.sin(time * 0.01 + i) * 30 + 800) % VW;
        const y = (VH - ((time * (0.2 + (i % 4) * 0.08) + i * 60) % VH));
        ctx.fillRect(x, y, 2, 2);
      }
    } else if (theme === 'neon') {
      // stars + moon
      for (let i = 0; i < 60; i++) {
        const x = SG.hash01(i) * VW;
        const y = SG.hash01(i + 100) * 220;
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.03 + i));
        ctx.fillStyle = `rgba(255,255,255,${tw * 0.8})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
      ctx.fillStyle = '#fdf3c8';
      ctx.beginPath();
      ctx.arc(130, 70, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = th.sky[0];
      ctx.beginPath();
      ctx.arc(142, 62, 22, 0, Math.PI * 2);
      ctx.fill();
      skyline(ctx, cam, 0.15, groundScreen - 10, th.far, 3, null, time);
      skyline(ctx, cam, 0.4, groundScreen, th.mid, 9, ['#ffd75e', '#5ef0ff'], time);
    }
  }

  function cloud(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 46 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.rect(x, y, 46 * s, 14 * s);
    ctx.fill();
  }

  function crystal(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y - s * 2);
    ctx.lineTo(x + s * 0.7, y);
    ctx.lineTo(x, y + s * 1.2);
    ctx.lineTo(x - s * 0.7, y);
    ctx.closePath();
    ctx.fill();
  }

  // World-space ground band and decorations.
  function drawGround(ctx, stage, cam, time) {
    const th = THEMES[stage.def.theme];
    const gy = stage.groundY;
    const x0 = cam.x - 10;
    const x1 = cam.x + VW / cam.zoom + 10;
    const bottom = VH + 20;
    ctx.fillStyle = th.ground;
    ctx.fillRect(x0, gy, x1 - x0, bottom - gy);
    ctx.fillStyle = th.groundDark;
    const theme = stage.def.theme;
    if (theme === 'docks') {
      for (let x = Math.floor(x0 / 50) * 50; x < x1; x += 50) ctx.fillRect(x, gy, 3, bottom - gy);
      for (let x = Math.floor(x0 / 100) * 100 + 20; x < x1; x += 100) {
        ctx.fillStyle = '#4a2a17';
        ctx.fillRect(x, gy + 12, 12, bottom - gy);
        ctx.fillStyle = th.groundDark;
      }
    } else if (theme === 'neon') {
      for (let x = Math.floor(x0 / 80) * 80; x < x1; x += 80) ctx.fillRect(x, gy + 26, 40, 4);
    } else {
      for (let i = Math.floor(x0 / 37); i * 37 < x1; i++) {
        const h = SG.hash01(i + 7);
        ctx.fillRect(i * 37 + h * 20, gy + 18 + h * 30, 8 + h * 6, 4);
      }
    }
    ctx.fillStyle = th.top;
    ctx.fillRect(x0, gy, x1 - x0, theme === 'neon' ? 4 : 8);
    if (theme === 'neon') {
      ctx.shadowColor = th.top;
      ctx.shadowBlur = 12;
      ctx.fillRect(x0, gy, x1 - x0, 3);
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = th.topLight;
    ctx.fillRect(x0, gy, x1 - x0, 2);
    if (theme === 'meadow') {
      // tufts & flowers (deterministic layout)
      for (let i = Math.floor(x0 / 23); i * 23 < x1; i++) {
        const h = SG.hash01(i * 3 + 1);
        const x = i * 23 + h * 12;
        ctx.fillStyle = th.top;
        ctx.beginPath();
        ctx.moveTo(x - 3, gy);
        ctx.lineTo(x, gy - 5 - h * 4);
        ctx.lineTo(x + 3, gy);
        ctx.fill();
        if (h > 0.82) {
          ctx.fillStyle = h > 0.91 ? '#fff3a0' : '#ff9ad5';
          ctx.beginPath();
          ctx.arc(x + 6, gy - 4, 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (theme === 'cavern') {
      for (let i = Math.floor(x0 / 60); i * 60 < x1; i++) {
        const h = SG.hash01(i + 77);
        if (h > 0.5) crystal(ctx, i * 60 + h * 30, gy - 4, 4 + h * 3, h > 0.75 ? 'rgba(255,140,230,0.8)' : 'rgba(140,235,255,0.8)');
      }
    }
  }

  function drawPlatforms(ctx, stage, alpha, time) {
    const th = THEMES[stage.def.theme];
    const theme = stage.def.theme;
    // motion rails first (show where movers travel → predictable)
    for (const pl of stage.platforms) {
      if (!pl.move) continue;
      ctx.strokeStyle = th.rail;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      if (pl.move.axis === 'x') {
        const a = pl.baseX;
        const b = pl.baseX + pl.move.dir * pl.move.range;
        const y = pl.baseY + pl.h / 2;
        ctx.moveTo(Math.min(a, b) + 6, y);
        ctx.lineTo(Math.max(a, b) + pl.w - 6, y);
      } else {
        const x = pl.baseX + pl.w / 2;
        ctx.moveTo(x, pl.baseY + pl.h);
        ctx.lineTo(x, pl.baseY - pl.move.range);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (const pl of stage.platforms) {
      const x = pl.px !== undefined ? SG.lerp(pl.px, pl.x, alpha) : pl.x;
      const y = pl.py !== undefined ? SG.lerp(pl.py, pl.y, alpha) : pl.y;
      const moving = !!pl.move;
      const w = pl.w;
      const h = pl.h;
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(x + 3, y + h, w - 6, 4);
      ctx.fillStyle = moving ? th.mover : th.plat;
      SG.roundRect(ctx, x, y, w, h + 2, 4);
      ctx.fill();
      ctx.fillStyle = th.platDark;
      ctx.fillRect(x + 2, y + h - 2, w - 4, 4);
      const topCol = moving && th.moverTop ? th.moverTop : th.platTop;
      if (theme === 'neon' || theme === 'cavern') {
        ctx.shadowColor = topCol;
        ctx.shadowBlur = 10;
      }
      ctx.fillStyle = topCol;
      ctx.fillRect(x, y, w, 4);
      ctx.shadowBlur = 0;
      ctx.fillStyle = th.platTopLight;
      ctx.fillRect(x + 2, y, w - 4, 1.5);
      if (theme === 'meadow') {
        ctx.fillStyle = th.platDark;
        for (let k = 18; k < w - 8; k += 28) ctx.fillRect(x + k, y + 6, 2, 5);
      } else if (theme === 'docks') {
        ctx.fillStyle = th.platDark;
        for (let k = 22; k < w; k += 22) ctx.fillRect(x + k, y + 4, 2, h - 2);
        if (moving) {
          ctx.fillStyle = '#e8d3a0';
          ctx.fillRect(x + 6, y + 5, 3, 6);
          ctx.fillRect(x + w - 9, y + 5, 3, 6);
        }
      } else if (moving) {
        // lift / slider arrows
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        const mx = x + w / 2;
        const my = y + 8;
        ctx.beginPath();
        if (pl.move.axis === 'y') {
          ctx.moveTo(mx - 4, my); ctx.lineTo(mx, my - 3); ctx.lineTo(mx + 4, my);
        } else {
          ctx.moveTo(mx - 7, my - 2); ctx.lineTo(mx - 10, my); ctx.lineTo(mx - 7, my + 2);
          ctx.moveTo(mx + 7, my - 2); ctx.lineTo(mx + 10, my); ctx.lineTo(mx + 7, my + 2);
        }
        ctx.fill();
      }
    }
  }

  // ============================================================== world
  SG.drawWorld = function (ctx, world, cam, vis, alpha, opts) {
    const time = opts.uiTicks || 0;
    const stage = world.stage;
    let shx = 0;
    let shy = 0;
    if (opts.shake && SG.FX.shake > 0) {
      shx = (SG.FX.rng() * 2 - 1) * SG.FX.shake;
      shy = (SG.FX.rng() * 2 - 1) * SG.FX.shake;
    }
    ctx.save();
    ctx.translate(shx, shy);
    drawBackdrop(ctx, stage, cam, time);
    ctx.save();
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.top);
    drawGround(ctx, stage, cam, time);
    drawPlatforms(ctx, stage, alpha, time);
    // fighters (draw the higher one last so the attacker reads on top)
    const order = world.players.slice().sort((a, b) => b.y - a.y);
    for (const p of order) {
      const ok = p.px !== undefined && Math.abs(p.px - p.x) < 40 && Math.abs(p.py - p.y) < 40;
      const x = ok ? SG.lerp(p.px, p.x, alpha) : p.x;
      const y = ok ? SG.lerp(p.py, p.y, alpha) : p.y;
      SG.drawFighter(ctx, p, vis[p.index], x, y);
      if (opts.labels) drawTag(ctx, p, x, y, opts.names[p.index], cam.zoom);
    }
    SG.FX.draw(ctx);
    if (opts.debug) drawHitboxes(ctx, world);
    ctx.restore();
    // off-screen indicators
    for (const p of world.players) {
      const sy = (p.y + p.h - cam.top) * cam.zoom;
      if (sy < 4) {
        const sx = (p.x + p.w / 2 - cam.x) * cam.zoom;
        ctx.fillStyle = SG.PALETTE[p.index].body;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, 4);
        ctx.lineTo(sx - 9, 18);
        ctx.lineTo(sx + 9, 18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
    if (SG.FX.flash > 0) {
      ctx.fillStyle = SG.FX.flashColor;
      ctx.globalAlpha = SG.FX.flash * 0.35;
      ctx.fillRect(-20, -20, VW + 40, VH + 40);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };

  function drawTag(ctx, p, x, y, name, zoom) {
    const cx = x + p.w / 2;
    const ty = y - 30;
    const s = 1 / Math.max(zoom, 0.75);
    ctx.save();
    ctx.translate(cx, ty);
    ctx.scale(s, s);
    ctx.globalAlpha = p.invuln > 0 ? 0.6 : 0.95;
    ctx.font = `bold 11px ${FONT}`;
    const tw = ctx.measureText(name).width + 22;
    ctx.fillStyle = SG.PALETTE[p.index].ink;
    SG.roundRect(ctx, -tw / 2, -9, tw, 16, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-4, 7);
    ctx.lineTo(4, 7);
    ctx.lineTo(0, 11);
    ctx.fill();
    SG.drawEmblem(ctx, p.index, -tw / 2 + 9, -1, 5);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 6, 0);
    ctx.restore();
  }

  function drawHitboxes(ctx, world) {
    ctx.lineWidth = 1;
    for (const pl of world.stage.platforms) {
      ctx.strokeStyle = 'rgba(255,255,0,0.9)';
      ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
    }
    for (const p of world.players) {
      ctx.strokeStyle = p.invuln > 0 ? 'rgba(0,255,255,0.95)' : 'rgba(0,255,0,0.95)';
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = 'rgba(255,0,0,0.9)';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + C.STOMP_TOLERANCE);
      ctx.lineTo(p.x + p.w, p.y + C.STOMP_TOLERANCE);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, world.stage.groundY);
    ctx.lineTo(world.stage.width, world.stage.groundY);
    ctx.stroke();
  }

  // ============================================================== text helpers
  SG.text = function (ctx, str, x, y, o) {
    o = o || {};
    ctx.font = `${o.weight || 'bold'} ${o.size || 16}px ${FONT}`;
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = o.baseline || 'middle';
    if (o.stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = o.strokeWidth || 4;
      ctx.strokeStyle = o.stroke;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);
  };

  const fmtTime = (ticks) => {
    const s = Math.max(0, Math.ceil(ticks / C.TICK_RATE));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  SG.fmtElapsed = (ticks) => {
    const ms = Math.floor(ticks * C.TICK_MS);
    return `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}.${String(Math.floor((ms % 1000) / 10)).padStart(2, '0')}`;
  };

  // ============================================================== HUD
  SG.createHud = () => ({ pulse: [0, 0], goT: 0, banner: null, lastCount: 3, countT: 0 });

  SG.hudEvent = function (hud, ev) {
    if (ev.type === 'score') hud.pulse[ev.who] = 1;
    if (ev.type === 'go') hud.goT = 50;
    if (ev.type === 'count' || ev.type === 'roundStart') { hud.lastCount = ev.n || 3; hud.countT = 0; }
    if (ev.type === 'suddenDeath') hud.banner = { kind: 'sudden', t: 0 };
    if (ev.type === 'roundEnd') hud.banner = { kind: 'round', winner: ev.winner, reason: ev.reason, matchOver: ev.matchOver, t: 0 };
    if (ev.type === 'roundStart') hud.banner = null;
  };
  SG.hudTick = function (hud) {
    for (let i = 0; i < 2; i++) hud.pulse[i] *= 0.9;
    if (hud.goT > 0) hud.goT--;
    hud.countT++;
    if (hud.banner) hud.banner.t++;
  };

  SG.drawHud = function (ctx, world, hud, names, time) {
    const t = SG.t;
    const [a, b] = world.players;
    const opts = world.opts;
    const practice = opts.winScore === 0;
    // score panel
    const pw = 300;
    const px = VW / 2 - pw / 2;
    ctx.fillStyle = 'rgba(10,12,30,0.62)';
    SG.roundRect(ctx, px, 8, pw, 50, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    for (let i = 0; i < 2; i++) {
      const p = world.players[i];
      const side = i === 0 ? -1 : 1;
      const sx = VW / 2 + side * 62;
      const scale = 1 + hud.pulse[i] * 0.5;
      ctx.save();
      ctx.translate(sx, 34);
      ctx.scale(scale, scale);
      SG.text(ctx, String(p.score), 0, 0, { size: 30, weight: '900', color: i === 0 ? '#ff7a70' : '#6fb8ff', stroke: 'rgba(0,0,0,0.5)', strokeWidth: 4 });
      ctx.restore();
      SG.drawEmblem(ctx, i, VW / 2 + side * 128, 24, 6);
      SG.text(ctx, names[i], VW / 2 + side * 128, 43, { size: 11, color: '#e8ecff' });
      if (!practice && opts.winScore > 1 && p.score === opts.winScore - 1 && world.phase === 'playing' && !world.suddenDeath) {
        const pulse = 0.7 + 0.3 * Math.sin(time * 0.2);
        ctx.globalAlpha = pulse;
        SG.text(ctx, t('matchPoint'), sx, 68, { size: 11, weight: '900', color: '#ffd23f', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
        ctx.globalAlpha = 1;
      }
    }
    // centre: timer or elapsed
    if (opts.timeLimit > 0) {
      const left = opts.timeLimit * C.TICK_RATE - world.tick;
      const urgent = left < 10 * C.TICK_RATE && world.phase === 'playing' && !world.suddenDeath;
      SG.text(ctx, world.suddenDeath ? 'SD' : fmtTime(left), VW / 2, 30, { size: 20, weight: '900', color: urgent && Math.floor(time / 15) % 2 ? '#ff5a5a' : '#fff' });
      SG.text(ctx, t('timer'), VW / 2, 47, { size: 9, color: 'rgba(255,255,255,0.6)', weight: 'normal' });
    } else {
      SG.text(ctx, practice ? t('practiceTag') : 'VS', VW / 2, 28, { size: practice ? 12 : 16, weight: '900', color: '#ffffff' });
      SG.text(ctx, SG.fmtElapsed(world.tick), VW / 2, 46, { size: 10, weight: 'normal', color: 'rgba(255,255,255,0.7)' });
    }
    // round pips
    if (opts.bestOf > 1) {
      const need = SG.roundsToWin(world);
      for (let i = 0; i < 2; i++) {
        for (let k = 0; k < need; k++) {
          const x = VW / 2 + (i === 0 ? -1 : 1) * (28 + k * 12);
          ctx.beginPath();
          ctx.arc(x, 64, 4, 0, Math.PI * 2);
          ctx.fillStyle = k < world.roundWins[i] ? (i === 0 ? '#ff7a70' : '#6fb8ff') : 'rgba(0,0,0,0.45)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.7)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    if (practice) SG.text(ctx, t('practiceHint'), VW - 10, VH - 12, { size: 11, align: 'right', color: 'rgba(255,255,255,0.75)', stroke: 'rgba(0,0,0,0.5)', strokeWidth: 3 });

    // countdown
    if (world.phase === 'countdown') {
      const n = Math.ceil(world.countdown / C.TICK_RATE);
      const frac = (world.countdown % C.TICK_RATE) / C.TICK_RATE;
      const s = 1 + (frac > 0.75 ? (frac - 0.75) * 2.4 : 0);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, 0, VW, VH);
      if (opts.bestOf > 1) {
        const last = world.roundWins[0] === SG.roundsToWin(world) - 1 && world.roundWins[1] === SG.roundsToWin(world) - 1;
        SG.text(ctx, last ? t('finalRound') : t('round', world.round), VW / 2, 120, { size: 26, weight: '900', color: '#ffd23f', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 5 });
      }
      ctx.save();
      ctx.translate(VW / 2, 200);
      ctx.scale(s, s);
      SG.text(ctx, String(n), 0, 0, { size: 86, weight: '900', color: '#fff', stroke: '#1a1030', strokeWidth: 8 });
      ctx.restore();
    } else if (hud.goT > 0) {
      const k = hud.goT / 50;
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.save();
      ctx.translate(VW / 2, 200);
      ctx.scale(1 + (1 - k) * 0.6, 1 + (1 - k) * 0.6);
      SG.text(ctx, t('go'), 0, 0, { size: 90, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 8 });
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    // banners
    const bn = hud.banner;
    if (bn && bn.kind === 'sudden' && bn.t < 150) {
      const a1 = bn.t < 120 ? 1 : 1 - (bn.t - 120) / 30;
      ctx.globalAlpha = a1;
      SG.text(ctx, t('suddenDeath'), VW / 2, 170, { size: 46, weight: '900', color: '#ff5a5a', stroke: '#1a1030', strokeWidth: 7 });
      SG.text(ctx, t('suddenSub'), VW / 2, 210, { size: 18, color: '#fff', stroke: '#1a1030', strokeWidth: 4 });
      ctx.globalAlpha = 1;
    } else if (bn && bn.kind === 'round' && world.phase === 'roundEnd') {
      const k = Math.min(1, bn.t / 12);
      ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
      ctx.fillRect(0, 140, VW, 110);
      const name = names[bn.winner];
      if (bn.reason === 'time') SG.text(ctx, t('timeUp'), VW / 2, 158, { size: 20, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 4 });
      ctx.save();
      ctx.translate(VW / 2, 198);
      const s = 0.6 + 0.4 * k + (bn.t < 20 ? Math.sin(bn.t * 0.5) * 0.04 : 0);
      ctx.scale(s, s);
      const label = bn.matchOver ? t('winsRound', name) : t('roundTo', name);
      SG.text(ctx, label, 0, 0, { size: 44, weight: '900', color: bn.winner === 0 ? '#ff7a70' : '#6fb8ff', stroke: '#fff', strokeWidth: 6 });
      ctx.restore();
    }
  };

  // ============================================================== debug overlay
  SG.drawDebug = function (ctx, game, fps) {
    const lines = [`FPS ${fps}   screen ${game.stack.join('>')}`];
    const s = game.session;
    if (s) {
      const w = s.world;
      lines.push(`phase ${w.phase}  tick ${w.tick}  time ${w.time}  round ${w.round}  cd ${w.countdown}`);
      for (const p of w.players) {
        lines.push(`P${p.index + 1} pos ${p.x.toFixed(1)},${p.y.toFixed(1)}  v ${p.vx.toFixed(1)},${p.vy.toFixed(2)}`);
        lines.push(`   gnd ${p.onGround ? 1 : 0} ride ${p.riding} coy ${p.coyote} buf ${p.jumpBuffer} inv ${p.invuln}`);
      }
      const ov = SG.overlaps(w.players[0], w.players[1]);
      lines.push(`contact ${ov ? 'YES' : 'no'}`);
      if (s.online) {
        const o = s.online;
        const n = game.net;
        lines.push(`NET P${o.slot + 1} #${n ? n.code : '-'} rtt ${n && n.rtt >= 0 ? Math.round(n.rtt) + 'ms' : '?'} f ${o.n} buf ${o.queue.length} stall ${o.stalls} desync ${o.desyncs}`);
      }
      if (s.ai) lines.push(`AI L${s.ai.level} ${s.ai.mode}  plan ${s.ai.planLen}  in ${['left', 'right', 'jumpHeld'].filter((k) => s.aiInput[k]).join('+') || '-'}`);
    }
    ctx.font = `12px Consolas, monospace`;
    const w = 380;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(6, VH - 10 - lines.length * 15, w, lines.length * 15 + 6);
    ctx.fillStyle = '#5f5';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, 12, VH - 6 - lines.length * 15 + i * 15));
  };

  // Static preview of a stage (used by stage select / menu backgrounds).
  SG.drawStagePreview = function (ctx, stage, x, y, w, h, time, vis) {
    const zoom = w / stage.width;
    const cam = { x: 0, top: VH - h / zoom, zoom, stage, cx: stage.width / 2 };
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.translate(x, y);
    // backdrop expects an 800x400 screen: scale it into the box
    ctx.save();
    ctx.scale(w / VW, h / VH);
    const bz = VW / stage.width;
    drawBackdrop(ctx, stage, { x: 0, top: VH - VH / bz, zoom: bz, stage }, time);
    ctx.restore();
    ctx.scale(zoom, zoom);
    ctx.translate(0, -cam.top);
    drawGround(ctx, stage, { x: 0, zoom: zoom, top: cam.top }, time);
    drawPlatforms(ctx, stage, 1, time);
    if (vis) {
      for (let i = 0; i < 2; i++) {
        const p = { index: i, x: stage.spawns[i], y: stage.groundY - C.PLAYER_H, w: C.PLAYER_W, h: C.PLAYER_H, vx: 0, vy: 0, onGround: true, facing: i === 0 ? 1 : -1, invuln: 0 };
        SG.drawFighter(ctx, p, vis[i], p.x, p.y);
      }
    }
    ctx.restore();
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
<script>
// ---- js/ui.js
// ui.js — draws every non-gameplay screen and overlay from the Game model (game.js).
// Also records clickable row rectangles for mouse support.
(function (root) {
  'use strict';
  const SG = root.SG;
  const C = SG.C;
  const VW = C.VIEW_W;
  const VH = C.VIEW_H;
  const t = (...a) => SG.t(...a);

  const UI = {
    rects: [],
    menuVis: [SG.createVis(0), SG.createVis(1)],
    resultVis: [SG.createVis(0), SG.createVis(1)],
    previewStages: {},
  };
  SG.UI = UI;

  function stageFor(id) {
    if (!UI.previewStages[id]) UI.previewStages[id] = SG.buildStage(SG.getStageDef(id));
    return UI.previewStages[id];
  }

  function panel(x, y, w, h, alpha) {
    const ctx = UI.ctx;
    ctx.fillStyle = `rgba(14,16,40,${alpha === undefined ? 0.82 : alpha})`;
    SG.roundRect(ctx, x, y, w, h, 18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function title(str, y, size, color) {
    SG.text(UI.ctx, str, VW / 2, y, { size: size || 32, weight: '900', color: color || '#fff', stroke: '#1a1030', strokeWidth: 6 });
  }

  function hint(str) {
    const ctx = UI.ctx;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, VH - 24, VW, 24);
    SG.text(ctx, str, VW / 2, VH - 12, { size: 12, weight: 'normal', color: 'rgba(255,255,255,0.85)' });
  }

  // Animated menu backdrop: the selected stage with both fighters idling.
  function backdrop(game, time) {
    const ctx = UI.ctx;
    const st = stageFor(SG.STAGES[game.stageIndex].id);
    const v = UI.menuVis;
    SG.drawStagePreview(ctx, st, 0, 0, VW, VH, time, v);
    ctx.fillStyle = 'rgba(8,8,30,0.45)';
    ctx.fillRect(0, 0, VW, VH);
  }

  function menuTickVis(time) {
    for (let i = 0; i < 2; i++) {
      const fake = { index: i, onGround: true, vx: 0, vy: 0, x: 0, y: 0 };
      SG.tickVis(UI.menuVis[i], fake, 'menu');
    }
  }
  UI.tick = menuTickVis;

  // Generic vertical list menu.
  function list(game, items, opt) {
    const ctx = UI.ctx;
    const n = items.length;
    const w = opt.w || 460;
    const x = VW / 2 - w / 2;
    const top = opt.top || 112;
    const avail = (opt.bottom || VH - 34) - top;
    const gap = Math.min(opt.gap || 36, avail / n);
    const size = gap < 24 ? 14 : 17;
    const sel = game.cursor[game.top()] || 0;
    const rowRects = [];
    const valueRects = []; // checked first: tapping the ‹ / › side of a value changes it
    panel(x, top - 14, w, gap * n + 22, opt.alpha);
    items.forEach((it, i) => {
      const y = top + gap * i + gap / 2;
      const active = i === sel;
      rowRects.push({ x, y: y - gap / 2, w, h: gap, index: i });
      if (it.adjust && !it.ok) {
        valueRects.push({ x: x + w - 250, y: y - gap / 2, w: 125, h: gap, index: i, action: 'dec' });
        valueRects.push({ x: x + w - 125, y: y - gap / 2, w: 125, h: gap, index: i, action: 'inc' });
      }
      if (active) {
        const g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, 'rgba(255,90,90,0.55)');
        g.addColorStop(1, 'rgba(70,150,255,0.55)');
        ctx.fillStyle = g;
        SG.roundRect(ctx, x + 10, y - gap / 2 + 2, w - 20, gap - 4, Math.min(12, gap / 2 - 2));
        ctx.fill();
        const bob = Math.sin(game.uiTicks * 0.2) * 2;
        SG.text(ctx, '▶', x + 26 + bob, y, { size: size - 3, color: '#ffd23f' });
      }
      const label = it.label();
      const hasValue = it.value || it.slider;
      SG.text(ctx, label, hasValue ? x + 44 : VW / 2, y, { size, align: hasValue ? 'left' : 'center', color: active ? '#fff' : 'rgba(235,238,255,0.85)' });
      if (it.slider) {
        const v = it.slider();
        const bx = x + w - 200;
        for (let k = 0; k < 10; k++) {
          ctx.fillStyle = k < v ? (active ? '#ffd23f' : '#c9cff5') : 'rgba(255,255,255,0.15)';
          ctx.fillRect(bx + k * 15, y - 6, 11, 12);
        }
        SG.text(ctx, String(v), x + w - 30, y, { size: size - 2, color: '#fff' });
      } else if (it.value) {
        const val = it.value();
        const vx = x + w - 34;
        if (it.adjust && (active || game.touchUI)) {
          ctx.font = `bold ${size}px ${SG.FONT}`;
          const vw = ctx.measureText(val).width;
          SG.text(ctx, '‹', vx - vw - 14, y, { size: size + 2, color: '#ffd23f' });
          SG.text(ctx, '›', vx + 12, y, { size: size + 2, color: '#ffd23f' });
        }
        SG.text(ctx, val, vx, y, { size, align: 'right', color: active ? '#ffe9a0' : '#c9cff5' });
      }
    });
    UI.rects = valueRects.concat(rowRects);
  }

  function drawTitle(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    const bounce = Math.sin(time * 0.05) * 4;
    ctx.save();
    ctx.translate(VW / 2, 120 + bounce);
    const r = 1 + Math.sin(time * 0.03) * 0.015;
    ctx.scale(r, r);
    SG.text(ctx, 'STOMP', -92, 0, { size: 74, weight: '900', color: '#ff5a4f', stroke: '#1a0b1e', strokeWidth: 12 });
    SG.text(ctx, 'DUEL', 150, 0, { size: 74, weight: '900', color: '#3f9bff', stroke: '#1a0b1e', strokeWidth: 12 });
    ctx.restore();
    // crown star between the words
    ctx.fillStyle = '#ffd23f';
    SG.starPath(ctx, VW / 2 + 32, 76 + bounce, 13, time * 0.02);
    ctx.fill();
    SG.text(ctx, t('subtitle'), VW / 2, 178, { size: 17, color: '#fff', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 4 });
    if (Math.floor(time / 30) % 2 === 0) SG.text(ctx, game.touchUI ? t('tapStart') : t('pressStart'), VW / 2, 250, { size: 22, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 5 });
    SG.text(ctx, 'v1.1', VW - 12, VH - 10, { size: 10, align: 'right', color: 'rgba(255,255,255,0.55)', weight: 'normal' });
  }

  function drawMain(game, time) {
    backdrop(game, time);
    title(SG.GAME_TITLE, 62, 40);
    list(game, game.menuItems(), { top: 108, gap: 38, w: 380 });
    hint(t('menuHint'));
  }

  function drawSetup(game, time) {
    backdrop(game, time);
    const mode = game.settings.setup.mode;
    title(mode === 'cpu' ? t('vsCpu') : mode === 'practice' ? t('practice') : mode === 'online' ? t('onlineTitle') : t('localVs'), 62, 34);
    SG.text(UI.ctx, t('matchSetup'), VW / 2, 92, { size: 14, color: 'rgba(255,255,255,0.8)' });
    list(game, game.menuItems(), { top: 124, gap: 40, w: 520 });
    hint(t('menuHint'));
  }

  function drawStageSelect(game, time) {
    const ctx = UI.ctx;
    const def = SG.STAGES[game.stageIndex];
    const st = stageFor(def.id);
    backdrop(game, time);
    title(t('stageSelect'), 40, 30);
    const bw = 440;
    const bh = 220;
    const bx = VW / 2 - bw / 2;
    const by = 64;
    ctx.fillStyle = '#000';
    SG.roundRect(ctx, bx - 6, by - 6, bw + 12, bh + 12, 14);
    ctx.fill();
    // live preview: platforms move as they do in-game
    const tt = Math.floor(time) % 100000;
    SG.updatePlatforms(st, tt);
    for (const pl of st.platforms) { pl.px = undefined; pl.py = undefined; }
    SG.drawStagePreview(ctx, st, bx, by, bw, bh, time, UI.menuVis);
    ctx.strokeStyle = '#ffd23f';
    ctx.lineWidth = 3;
    SG.roundRect(ctx, bx - 4, by - 4, bw + 8, bh + 8, 12);
    ctx.stroke();
    const pulse = Math.sin(time * 0.15) * 4;
    SG.text(ctx, '◀', bx - 34 - pulse, by + bh / 2, { size: 30, color: '#ffd23f', stroke: '#1a1030', strokeWidth: 5 });
    SG.text(ctx, '▶', bx + bw + 34 + pulse, by + bh / 2, { size: 30, color: '#ffd23f', stroke: '#1a1030', strokeWidth: 5 });
    UI.rects = [
      { x: bx - 60, y: by + bh / 2 - 30, w: 50, h: 60, index: -1, action: 'prev' },
      { x: bx + bw + 10, y: by + bh / 2 - 30, w: 50, h: 60, index: -1, action: 'next' },
      { x: bx, y: by, w: bw, h: bh, index: -1, action: 'start' },
    ];
    const name = def.name[SG.lang] || def.name.en;
    const desc = def.desc[SG.lang] || def.desc.en;
    SG.text(ctx, name, VW / 2, by + bh + 24, { size: 24, weight: '900', color: '#fff', stroke: '#1a1030', strokeWidth: 5 });
    SG.text(ctx, desc, VW / 2, by + bh + 47, { size: 13, color: '#e6e9ff', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
    // tags
    let tx = VW / 2 - (def.tags.length - 1) * 75;
    for (const tag of def.tags) {
      const label = t('tag_' + tag);
      ctx.font = `bold 10px ${SG.FONT}`;
      const w = ctx.measureText(label).width + 16;
      ctx.fillStyle = tag === 'moving' ? '#8a3df0' : tag === 'wide' ? '#1d8a6a' : '#b0602a';
      SG.roundRect(ctx, tx - w / 2, by - 2 + 10, w, 16, 8);
      ctx.fill();
      SG.text(ctx, label, tx, by + 16, { size: 10, color: '#fff' });
      tx += 150;
    }
    // page dots
    for (let i = 0; i < SG.STAGES.length; i++) {
      ctx.beginPath();
      ctx.arc(VW / 2 + (i - (SG.STAGES.length - 1) / 2) * 16, VH - 40, 4, 0, Math.PI * 2);
      ctx.fillStyle = i === game.stageIndex ? '#ffd23f' : 'rgba(255,255,255,0.35)';
      ctx.fill();
    }
    hint(t('stageHint'));
  }

  function drawSettings(game, time, inMatch) {
    if (!inMatch) backdrop(game, time);
    title(t('settings'), 40, 30);
    list(game, game.menuItems(), { top: 74, gap: 26, w: 540, bottom: VH - 30 });
    hint(t('menuHint'));
  }

  function drawControls(game, time, inMatch) {
    const ctx = UI.ctx;
    if (!inMatch) backdrop(game, time);
    title(t('controlsTitle'), 40, 30);
    list(game, game.menuItems(), { top: 80, gap: 34, w: 480, bottom: VH - 40 });
    if (game.capture) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, VW, VH);
      panel(VW / 2 - 230, VH / 2 - 50, 460, 100);
      const pl = game.capture.player.toUpperCase();
      const act = t(game.capture.action === 'left' ? 'moveLeft' : game.capture.action === 'right' ? 'moveRight' : 'jump');
      SG.text(ctx, `${pl} — ${act}`, VW / 2, VH / 2 - 16, { size: 20, weight: '900', color: game.capture.player === 'p1' ? '#ff7a70' : '#6fb8ff' });
      SG.text(ctx, t('pressKey'), VW / 2, VH / 2 + 18, { size: 15, color: '#fff' });
    }
    hint(t('controlsHint'));
  }

  function keyLines() {
    const k = UI.game.settings.keys;
    const n = SG.keyName;
    return {
      p1: t('p1Line', n(k.p1.left), n(k.p1.right), n(k.p1.jump)),
      p2: t('p2Line', n(k.p2.left), n(k.p2.right), n(k.p2.jump)),
    };
  }

  function drawHowTo(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    const pages = t('howPages');
    const page = pages[game.howPage];
    title(t('howTo'), 40, 30);
    panel(90, 66, VW - 180, 280);
    SG.text(ctx, page.title, VW / 2, 92, { size: 22, weight: '900', color: '#ffd23f' });
    const kl = keyLines();
    let y = 128;
    const gap = page.lines.length > 6 ? 24 : game.howPage === 0 ? 25 : 30;
    for (const line of page.lines) {
      const str = line === '{p1}' ? kl.p1 : line === '{p2}' ? kl.p2 : line;
      const col = line === '{p1}' ? '#ff9a90' : line === '{p2}' ? '#8cc8ff' : '#eef0ff';
      SG.text(ctx, str, VW / 2, y, { size: 15, color: col, weight: line.startsWith('{') ? 'bold' : 'normal' });
      y += gap;
    }
    if (game.howPage === 0) {
      // little diagram: Ember stomping Tide
      const v = UI.menuVis;
      const a = { index: 0, x: 0, y: 0, w: 30, h: 40, vx: 0, vy: 9, onGround: false, facing: 1, invuln: 0 };
      const b = { index: 1, x: 0, y: 0, w: 30, h: 40, vx: 0, vy: 0, onGround: true, facing: -1, invuln: 0 };
      const ph = (time % 90) / 90;
      const ay = 238 + Math.min(ph * 2, 1) * 18;
      SG.drawFighter(ctx, b, v[1], VW / 2 - 15, 296);
      SG.drawFighter(ctx, a, v[0], VW / 2 - 12, ay);
      if (ph > 0.5 && ph < 0.75) {
        ctx.fillStyle = '#ffe066';
        SG.starPath(ctx, VW / 2 + 26, 293, 7, time * 0.1);
        ctx.fill();
        SG.text(ctx, '+1', VW / 2 + 50, 281, { size: 18, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 4 });
      }
    }
    hint(t('page', game.howPage + 1, pages.length));
  }

  function drawCredits(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    panel(110, 40, VW - 220, 310);
    const lines = t('creditsLines');
    let y = 70;
    lines.forEach((l, i) => {
      SG.text(ctx, l, VW / 2, y, i === 0 ? { size: 28, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 5 } : { size: 14, color: '#eef0ff', weight: 'normal' });
      y += i === 0 ? 36 : 26;
    });
    hint('Enter / Esc');
  }

  function drawPause(game, time) {
    const ctx = UI.ctx;
    ctx.fillStyle = 'rgba(6,6,24,0.62)';
    ctx.fillRect(0, 0, VW, VH);
    title(t('paused'), 92, 44);
    const net = game.net;
    if (net && net.pausedBy >= 0) {
      const who = net.pausedBy === net.slot ? t('you') : 'P' + (net.pausedBy + 1);
      SG.text(ctx, t('pausedBy', who), VW / 2, 128, { size: 13, color: '#ffd23f' });
    } else if (game.focusPaused) SG.text(ctx, t('focusLost'), VW / 2, 128, { size: 13, color: '#ffd23f' });
    list(game, game.menuItems(), { top: 150, gap: 40, w: 340 });
    hint(t('menuHint'));
  }

  function drawResults(game, time) {
    const ctx = UI.ctx;
    const s = game.session;
    const w = s.world;
    const win = w.matchWinner;
    const k = Math.min(1, game.screenTicks / 20);
    ctx.fillStyle = `rgba(6,6,24,${0.55 * k})`;
    ctx.fillRect(0, 0, VW, VH);
    const names = UI.names;
    ctx.save();
    ctx.translate(VW / 2, 62);
    const sc = 0.7 + 0.3 * k + Math.sin(time * 0.08) * 0.02;
    ctx.scale(sc, sc);
    const header = s.online ? (win === s.online.slot ? t('youWin') : t('youLose')) : t('wins', names[win]);
    SG.text(ctx, header, 0, 0, { size: 52, weight: '900', color: win === 0 ? '#ff6a5f' : '#4fa6ff', stroke: '#fff', strokeWidth: 8 });
    ctx.restore();
    // stats panel
    const px = VW / 2 - 230;
    panel(px, 100, 460, 136, 0.85);
    const [a, b] = w.players;
    const series = w.opts.bestOf > 1;
    SG.drawEmblem(ctx, 0, VW / 2 - 140, 124, 8);
    SG.drawEmblem(ctx, 1, VW / 2 + 140, 124, 8);
    SG.text(ctx, names[0], VW / 2 - 140, 142, { size: 12, color: '#ffb0a8' });
    SG.text(ctx, names[1], VW / 2 + 140, 142, { size: 12, color: '#a8d2ff' });
    const big = series ? `${w.roundWins[0]} - ${w.roundWins[1]}` : `${a.score} - ${b.score}`;
    SG.text(ctx, series ? t('rounds') : t('finalScore'), VW / 2, 116, { size: 11, color: 'rgba(255,255,255,0.7)', weight: 'normal' });
    SG.text(ctx, big, VW / 2, 140, { size: 32, weight: '900', color: '#fff' });
    const rows = [
      [t('stomps'), w.stats.stomps[0], w.stats.stomps[1]],
      [t('bestStreak'), w.stats.longestStreak[0], w.stats.longestStreak[1]],
      [t('matchTime'), SG.fmtElapsed(w.totalTicks), null],
    ];
    rows.forEach((r, i) => {
      const y = 172 + i * 20;
      SG.text(ctx, r[0], VW / 2, y, { size: 12, color: 'rgba(255,255,255,0.7)', weight: 'normal' });
      if (r[2] === null) SG.text(ctx, String(r[1]), VW / 2 + 140, y, { size: 13, color: '#fff' });
      else {
        SG.text(ctx, String(r[1]), VW / 2 - 140, y, { size: 13, color: '#fff' });
        SG.text(ctx, String(r[2]), VW / 2 + 140, y, { size: 13, color: '#fff' });
      }
    });
    // big winner (cheering) and loser (slumped) on either side
    for (let i = 0; i < 2; i++) {
      const v = UI.resultVis[i];
      v.result = i === win ? 'win' : 'lose';
      v.t = time;
      const fx = i === 0 ? 92 : VW - 92;
      const p = { index: i, x: 0, y: 0, w: 30, h: 40, vx: 0, vy: 0, onGround: true, facing: i === 0 ? 1 : -1, invuln: 0 };
      ctx.save();
      ctx.translate(fx, 300);
      const s = i === win ? 2.2 : 1.6;
      ctx.scale(s, s);
      SG.drawFighter(ctx, p, v, -15, -40);
      ctx.restore();
      if (i === win) {
        ctx.fillStyle = '#ffd23f';
        SG.starPath(ctx, fx, 300 - 150 + Math.sin(time * 0.1) * 4, 14, time * 0.03);
        ctx.fill();
      }
    }
    if (game.screenTicks > 25) list(game, game.menuItems(), { top: 262, gap: 34, w: 300, bottom: VH - 30 });
    else UI.rects = [];
    hint(t('menuHint'));
  }

  // ---------------------------------------------------------------- online screens
  function drawOnline(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    title(t('onlineTitle'), 44, 32);
    panel(110, 70, VW - 220, 128);
    const lines = t('onlineInfo');
    lines.forEach((l, i) => SG.text(ctx, l, VW / 2, 92 + i * 26, { size: 14, color: i === 1 ? '#ffe9a0' : '#eef0ff', weight: i === 1 ? 'bold' : 'normal' }));
    if (!game.hooks.netConnect) {
      // opened as a file: say exactly how to turn online on (flashes when Create/Join is pressed)
      const flash = game.serverHint > 0 && Math.floor(game.serverHint / 6) % 2 === 0;
      t('noServerInfo').forEach((l, i) => SG.text(ctx, l, VW / 2, 213 + i * 21, {
        size: i === 0 ? 13 : 14, weight: i === 0 ? 'normal' : '900',
        color: i === 0 ? '#ff9a90' : flash ? '#ffffff' : '#ffd23f', stroke: 'rgba(0,0,0,0.75)', strokeWidth: 4,
      }));
      list(game, game.menuItems(), { top: 266, gap: 33, w: 340, bottom: VH - 30 });
      hint(t('menuHint'));
      return;
    } else if (SG.deviceUrls && SG.deviceUrls.length) {
      SG.text(ctx, t('otherDevices', SG.deviceUrls[0]), VW / 2, 213, { size: 14, weight: '900', color: '#8cc8ff', stroke: 'rgba(0,0,0,0.7)', strokeWidth: 4 });
    }
    list(game, game.menuItems(), { top: 236, gap: 38, w: 340, bottom: VH - 30 });
    hint(t('menuHint'));
  }

  function drawJoin(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    title(t('joinRoom'), 40, 30);
    SG.text(ctx, t('enterCode'), VW / 2, 74, { size: 15, color: '#eef0ff' });
    // code boxes
    const n = SG.NET.CODE_LEN;
    for (let i = 0; i < n; i++) {
      const bx = VW / 2 - (n * 52) / 2 + i * 52 + 4;
      ctx.fillStyle = 'rgba(14,16,40,0.9)';
      SG.roundRect(ctx, bx, 90, 44, 52, 10);
      ctx.fill();
      const caret = i === game.joinCode.length && Math.floor(time / 20) % 2 === 0;
      ctx.strokeStyle = caret ? '#ffd23f' : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      const ch = game.joinCode[i];
      if (ch) SG.text(ctx, ch, bx + 22, 117, { size: 30, weight: '900', color: '#fff' });
    }
    // keypad
    UI.rects = [];
    const kw = 74;
    const kh = 44;
    const kx = VW / 2 - (kw * 3 + 16) / 2;
    const ky = 156;
    SG.JOIN_KEYS.forEach((key, i) => {
      const x = kx + (i % 3) * (kw + 8);
      const y = ky + Math.floor(i / 3) * (kh + 6);
      const active = i === game.joinCursor;
      const ready = key === 'ok' && game.joinCode.length === n;
      ctx.fillStyle = active ? 'rgba(255,210,63,0.9)' : ready ? 'rgba(60,170,90,0.9)' : 'rgba(14,16,40,0.85)';
      SG.roundRect(ctx, x, y, kw, kh, 10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();
      const label = key === 'del' ? '⌫' : key === 'ok' ? 'OK' : key;
      SG.text(ctx, label, x + kw / 2, y + kh / 2 + 1, { size: 20, weight: '900', color: active ? '#1a1030' : '#fff' });
      UI.rects.push({ x, y, w: kw, h: kh, index: -1, action: 'key', value: key });
    });
    hint(t('joinHint'));
  }

  function drawLobby(game, time) {
    const ctx = UI.ctx;
    backdrop(game, time);
    const net = game.net;
    title(t('onlineTitle'), 40, 30);
    panel(90, 64, VW - 180, 222);
    if (!net || net.phase === 'connecting') {
      const dots = '.'.repeat(1 + (Math.floor(time / 15) % 3));
      const msg = net && net.intent === 'join' ? t('joining', net.code) : t('connecting');
      SG.text(ctx, msg.replace('…', '') + dots, VW / 2, 180, { size: 20, weight: '900', color: '#fff' });
    } else {
      SG.text(ctx, t('roomCode'), VW / 2, 90, { size: 13, color: 'rgba(255,255,255,0.75)' });
      SG.text(ctx, net.code.split('').join(' '), VW / 2, 128, { size: 50, weight: '900', color: '#ffd23f', stroke: '#1a1030', strokeWidth: 6 });
      const pulse = 0.6 + 0.4 * Math.sin(time * 0.1);
      ctx.globalAlpha = pulse;
      SG.text(ctx, t('waitingOpp'), VW / 2, 170, { size: 16, color: '#fff' });
      ctx.globalAlpha = 1;
      if (net.urls.length) {
        SG.text(ctx, t('shareHint'), VW / 2, 200, { size: 12, color: 'rgba(255,255,255,0.75)', weight: 'normal' });
        net.urls.slice(0, 2).forEach((u, i) => SG.text(ctx, u, VW / 2, 222 + i * 22, { size: 16, color: '#8cc8ff' }));
      }
      SG.text(ctx, t('orJoin'), VW / 2, 270, { size: 12, color: 'rgba(255,255,255,0.7)', weight: 'normal' });
    }
    list(game, game.menuItems(), { top: 306, gap: 30, w: 300, bottom: VH - 30 });
    hint(t('menuHint'));
  }

  // On-screen buttons for touch screens (drawn over the match).
  UI.drawTouch = function (ctx, game, active) {
    for (const b of game.touchButtons()) {
      const on = active.has(b.code);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      const tint = b.who === 0 ? '255,110,100' : b.who === 1 ? '90,160,255' : '255,255,255';
      ctx.fillStyle = `rgba(${tint},${on ? 0.55 : 0.22})`;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(255,255,255,${on ? 0.9 : 0.5})`;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const s = b.r * 0.42;
      ctx.beginPath();
      if (b.icon === 'left') { ctx.moveTo(b.x - s, b.y); ctx.lineTo(b.x + s * 0.7, b.y - s); ctx.lineTo(b.x + s * 0.7, b.y + s); }
      else if (b.icon === 'right') { ctx.moveTo(b.x + s, b.y); ctx.lineTo(b.x - s * 0.7, b.y - s); ctx.lineTo(b.x - s * 0.7, b.y + s); }
      else if (b.icon === 'jump') { ctx.moveTo(b.x, b.y - s); ctx.lineTo(b.x + s, b.y + s * 0.7); ctx.lineTo(b.x - s, b.y + s * 0.7); }
      else { ctx.rect(b.x - s * 0.6, b.y - s * 0.7, s * 0.4, s * 1.4); ctx.rect(b.x + s * 0.2, b.y - s * 0.7, s * 0.4, s * 1.4); }
      ctx.closePath();
      ctx.fill();
    }
  };

  // Entry point used by main.js
  UI.draw = function (ctx, game, time, inMatch) {
    UI.ctx = ctx;
    UI.game = game;
    switch (game.top()) {
      case 'title': drawTitle(game, time); break;
      case 'main': drawMain(game, time); break;
      case 'setup': drawSetup(game, time); break;
      case 'stage': drawStageSelect(game, time); break;
      case 'settings': if (inMatch) dim(ctx); drawSettings(game, time, inMatch); break;
      case 'controls': if (inMatch) dim(ctx); drawControls(game, time, inMatch); break;
      case 'howto': drawHowTo(game, time); break;
      case 'credits': drawCredits(game, time); break;
      case 'online': drawOnline(game, time); break;
      case 'join': drawJoin(game, time); break;
      case 'lobby': drawLobby(game, time); break;
      case 'pause': drawPause(game, time); break;
      case 'results': drawResults(game, time); break;
      default: UI.rects = []; break;
    }
    if (game.toast) {
      ctx.globalAlpha = Math.min(1, game.toast.ticks / 20);
      panel(VW / 2 - 130, VH - 64, 260, 30, 0.9);
      SG.text(ctx, game.toast.text, VW / 2, VH - 49, { size: 13, color: '#ffd23f' });
      ctx.globalAlpha = 1;
    }
    // lightweight fade-in on every screen change
    if (game.screenTicks < 10 && game.top() !== 'pause' && game.top() !== 'results') {
      ctx.fillStyle = `rgba(0,0,0,${(1 - game.screenTicks / 10) * 0.6})`;
      ctx.fillRect(0, 0, VW, VH);
    }
  };

  function dim(ctx) {
    ctx.fillStyle = 'rgba(6,6,24,0.75)';
    ctx.fillRect(0, 0, VW, VH);
  }
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
<script>
// ---- js/main.js
// main.js — browser entry point: canvas/display, keyboard & mouse, storage, the fixed-timestep
// loop, and wiring simulation events to effects. Physics always runs at exactly 60 ticks/s;
// rendering runs every animation frame and interpolates between ticks.
(function () {
  'use strict';
  const SG = window.SG;
  const C = SG.C;
  const VW = C.VIEW_W;
  const VH = C.VIEW_H;
  const STORAGE_KEY = 'stompduel.settings.v1';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let backing = 1;

  // ---------------------------------------------------------------- display
  let scaleSetting = 'fit';
  function fitCanvas() {
    const pad = window.innerWidth < 900 ? 0 : 16; // phones: use the whole screen
    const maxW = window.innerWidth - pad;
    const maxH = window.innerHeight - pad;
    const fit = Math.max(0.5, Math.min(maxW / VW, maxH / VH));
    let s = scaleSetting === 'fit' || document.fullscreenElement ? fit : Math.min(scaleSetting, fit);
    if (!isFinite(s) || s <= 0) s = 1;
    const cssW = Math.round(VW * s);
    const cssH = Math.round(VH * s);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    backing = canvas.width / VW;
  }
  window.addEventListener('resize', fitCanvas);
  document.addEventListener('fullscreenchange', fitCanvas);

  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {
      /* fullscreen not allowed here */
    }
  }

  // ---------------------------------------------------------------- storage
  function load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function save(s) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch (e) {
      /* private mode / blocked storage: settings just won't persist */
    }
  }

  // ---------------------------------------------------------------- presentation state for a match
  const pres = { vis: null, hud: null, cam: null, touching: false };
  let game = null;

  function names() {
    const s = game.session;
    if (s && s.online) return s.online.slot === 0 ? ['P1 · ' + SG.t('you'), 'P2'] : ['P1', 'P2 · ' + SG.t('you')];
    if (!s || !s.ai) return ['P1', 'P2'];
    return ['P1', s.ai.level === 0 ? 'DUMMY' : SG.t('cpu') + ' ' + s.ai.level];
  }

  function onMatchStart(session) {
    SG.FX.clear();
    pres.vis = [SG.createVis(0), SG.createVis(1)];
    pres.hud = SG.createHud();
    pres.cam = SG.createCamera(session.world.stage);
    SG.snapCamera(pres.cam, session.world.players);
    pres.touching = false;
  }

  function onWorldEvents(events, session) {
    const w = session.world;
    const FX = SG.FX;
    const shakeOn = game.settings.shake;
    let touching = false;
    for (const ev of events) {
      SG.hudEvent(pres.hud, ev);
      switch (ev.type) {
        case 'jump':
        case 'land':
          SG.visEvent(pres.vis[ev.who], ev, w.players[ev.who]);
          break;
        case 'bump':
          touching = true;
          if (!pres.touching) FX.sideDust(ev.x, ev.y, 0);
          break;
        case 'stomp': {
          const top = w.players[ev.top];
          const victim = w.players[ev.bottom];
          victim.px = victim.x; // teleported: don't interpolate from the hit position
          victim.py = victim.y;
          SG.visEvent(pres.vis[ev.top], { type: 'stompTop' }, top);
          SG.visEvent(pres.vis[ev.bottom], { type: 'respawn' }, victim);
          FX.ghost(ev.x, ev.y, ev.bottom, ev.facing);
          FX.stars(ev.x, ev.y, 6);
          FX.burst(ev.x, ev.y, SG.PALETTE[ev.top].light, 14, 5);
          FX.ring(ev.x, ev.y, '#fff', 46, 18);
          FX.text(top.x + top.w / 2, top.y - 34, '+1', ev.top === 0 ? '#ff8a80' : '#82c4ff', 24);
          FX.ring(victim.x + victim.w / 2, victim.y + victim.h / 2, SG.PALETTE[ev.bottom].light, 34, 22);
          FX.dust(victim.x + victim.w / 2, victim.y + victim.h, 6, 12, SG.PALETTE[ev.bottom].light);
          if (shakeOn) FX.shake = Math.max(FX.shake, 7);
          FX.flash = 0.5;
          FX.flashColor = '#ffffff';
          break;
        }
        case 'go':
          FX.flash = 0.25;
          break;
        case 'roundStart':
          for (const p of w.players) { p.px = p.x; p.py = p.y; }
          for (const p of w.stage.platforms) { p.px = p.x; p.py = p.y; }
          SG.snapCamera(pres.cam, w.players);
          break;
        case 'suddenDeath':
          FX.flash = 0.6;
          FX.flashColor = '#ff3030';
          if (shakeOn) FX.shake = Math.max(FX.shake, 5);
          break;
        case 'roundEnd': {
          const winner = w.players[ev.winner];
          pres.vis[ev.winner].result = 'win';
          pres.vis[1 - ev.winner].result = 'lose';
          if (ev.matchOver) {
            FX.confetti(pres.cam.x, pres.cam.x + VW / pres.cam.zoom, pres.cam.top, 90);
            if (shakeOn) FX.shake = Math.max(FX.shake, 10);
          } else {
            FX.burst(winner.x + 15, winner.y + 10, '#ffd23f', 20, 5);
          }
          break;
        }
        default:
          break;
      }
    }
    pres.touching = touching;
  }

  function onTick(session) {
    const w = session.world;
    for (let i = 0; i < 2; i++) SG.tickVis(pres.vis[i], w.players[i], w.phase);
    SG.FX.tick();
    SG.hudTick(pres.hud);
  }

  // ---------------------------------------------------------------- online connection
  // Online play needs the page to be served by server.js (same host); file:// has no server.
  const onServer = location.protocol === 'http:' || location.protocol === 'https:';
  function netConnect(onMessage, onClose) {
    let sock;
    try {
      sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    } catch (e) {
      return null;
    }
    const outbox = [];
    let closed = false;
    sock.onopen = () => { while (outbox.length) sock.send(outbox.shift()); };
    sock.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }
      onMessage(msg);
    };
    sock.onclose = () => { if (!closed) { closed = true; onClose(); } };
    sock.onerror = () => { /* followed by onclose */ };
    return {
      send(obj) {
        const text = JSON.stringify(obj);
        if (sock.readyState === 1) sock.send(text);
        else if (sock.readyState === 0) outbox.push(text);
      },
      close() {
        closed = true;
        try { sock.close(); } catch (e) { /* ignore */ }
      },
    };
  }
  // Addresses to show the other player. When this page was opened as "localhost", other devices
  // need the computer's network address, which the server reports.
  function baseUrls(ips, port) {
    const local = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);
    if (!local) return [location.origin];
    return ips.map((ip) => `http://${ip}:${port || location.port}`);
  }
  function shareUrls(code, ips, port) {
    return baseUrls(ips, port).map((u) => u + '/?room=' + code);
  }
  // Clipboard. Runs inside the key/tap handler (a user gesture). execCommand works on plain-http LAN
  // addresses too, where navigator.clipboard is unavailable (it needs a secure context).
  function copyText(text) {
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) {
      ok = false;
    }
    if (!ok && navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => {});
      ok = true;
    }
    canvas.focus();
    return ok;
  }

  // Address other devices should open (shown on the Online screen).
  SG.deviceUrls = [];
  if (onServer) {
    fetch('/info', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((info) => { if (info && Array.isArray(info.ips)) SG.deviceUrls = baseUrls(info.ips, info.port); })
      .catch(() => { /* not served by server.js */ });
  }

  // ---------------------------------------------------------------- game
  const defaultLang = (navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  game = new SG.Game({
    defaultLang,
    sfx: (name, o) => SG.Audio.play(name, o),
    music: (track) => SG.Audio.music(track),
    duck: (on) => SG.Audio.duck(on),
    applyAudio: (s) => SG.Audio.apply(s),
    applyDisplay: (s) => {
      scaleSetting = s.scale;
      document.documentElement.lang = s.lang;
      fitCanvas();
    },
    toggleFullscreen,
    isFullscreen: () => !!document.fullscreenElement,
    load,
    save,
    seed: () => (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0,
    onMatchStart,
    onWorldEvents,
    onTick,
    netConnect: onServer && 'WebSocket' in window ? netConnect : null,
    now: () => performance.now(),
    shareUrls,
    copyText,
  });
  window.game = game; // handy for debugging from the console

  // ---------------------------------------------------------------- input
  const PASS_THROUGH = ['F5', 'F11', 'F12'];
  window.addEventListener('keydown', (e) => {
    SG.Audio.unlock();
    if (e.ctrlKey || e.metaKey || e.altKey) return; // leave browser shortcuts alone
    if (PASS_THROUGH.includes(e.code)) return;
    e.preventDefault();
    game.touchUI = false; // a keyboard is in use: hide the on-screen buttons
    game.keyDown(e.code, e.repeat);
  });
  window.addEventListener('keyup', (e) => game.keyUp(e.code));
  window.addEventListener('blur', () => game.blur());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      game.blur();
      SG.Audio.suspend();
    } else SG.Audio.resume();
  });

  function toView(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * VW, y: ((e.clientY - r.top) / r.height) * VH };
  }
  function hit(pt) {
    for (const r of SG.UI.rects) if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) return r;
    return null;
  }
  // Menus: mouse, pen and touch all select/activate rows.
  function menuPointer(pt) {
    const top = game.top();
    const r = hit(pt);
    if (top === 'title' || top === 'credits') return game.menuKey('Enter', false);
    if (top === 'howto') return game.menuKey('ArrowRight', false);
    if (!r) return;
    if (r.action === 'prev') game.menuKey('ArrowLeft', false);
    else if (r.action === 'next') game.menuKey('ArrowRight', false);
    else if (r.action === 'start') game.menuKey('Enter', false);
    else if (r.action === 'dec' || r.action === 'inc') game.pointerAdjust(r.index, r.action === 'dec' ? -1 : 1);
    else if (r.action === 'key') game.joinKey(r.value);
    else game.pointerSelect(r.index, true);
  }

  // Matches on a touch screen: every finger is mapped to an on-screen button; the set of pressed
  // buttons is turned into virtual key presses ("Touch0Left", "Touch0Jump", …).
  const fingers = new Map(); // pointerId → view point
  let touchDown = new Set();
  function syncTouch() {
    const now = new Set();
    if (game.top() === 'play') {
      const buttons = game.touchButtons();
      for (const pt of fingers.values()) {
        const b = SG.touchHit(buttons, pt.x, pt.y);
        if (b) now.add(b.code);
      }
    }
    for (const c of touchDown) if (!now.has(c)) game.keyUp(c);
    for (const c of now) if (!game.keys[c]) game.keyDown(c, false); // also re-presses after a pause
    touchDown = now;
  }
  SG.touchState = () => touchDown;

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') {
      if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, toView(e)); syncTouch(); }
      return;
    }
    const r = hit(toView(e));
    canvas.style.cursor = r || game.top() === 'title' ? 'pointer' : 'default';
    if (r && r.index >= 0 && !r.action) game.pointerSelect(r.index, false);
  });
  canvas.addEventListener('pointerdown', (e) => {
    SG.Audio.unlock();
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const pt = toView(e);
    if (e.pointerType === 'touch') {
      game.touchUI = true;
      if (game.top() === 'play') {
        fingers.set(e.pointerId, pt);
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
        syncTouch();
        return;
      }
    }
    menuPointer(pt);
  });
  const fingerUp = (e) => {
    if (!fingers.delete(e.pointerId)) return;
    syncTouch();
  };
  canvas.addEventListener('pointerup', fingerUp);
  canvas.addEventListener('pointercancel', fingerUp);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------------------------------------------------------------- gamepads
  // First connected controller is P1, second is P2 (in 1P / online modes either controls you).
  // Buttons become virtual keys "Pad<slot><Button>" so menus, pause and play reuse the keyboard paths.
  const PAD_BUTTONS = ['Left', 'Right', 'Up', 'Down', 'A', 'B', 'Start'];
  const padPrev = [{}, {}];
  const padHeld = [{}, {}];
  let padIds = [null, null];
  function readPad(gp) {
    const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes[0] || 0;
    const ay = gp.axes[1] || 0;
    return {
      Left: b(14) || ax < -0.5, Right: b(15) || ax > 0.5, Up: b(12) || ay < -0.5, Down: b(13) || ay > 0.5,
      A: b(0), B: b(1), Start: b(9),
    };
  }
  function pollPads() {
    if (!navigator.getGamepads) return;
    let list = [];
    try { list = Array.from(navigator.getGamepads()).filter((p) => p && p.connected); } catch (e) { return; }
    list.sort((a, b) => a.index - b.index);
    for (let slot = 0; slot < 2; slot++) {
      const gp = list[slot];
      const id = gp ? gp.index : null;
      if (id !== padIds[slot]) {
        if (id !== null) game.toast = { text: SG.t('padOn', slot + 1), ticks: 120 };
        else if (padIds[slot] !== null) game.toast = { text: SG.t('padOff', slot + 1), ticks: 120 };
        padIds[slot] = id;
      }
      const now = gp ? readPad(gp) : {};
      const prev = padPrev[slot];
      const held = padHeld[slot];
      for (const name of PAD_BUTTONS) {
        const code = 'Pad' + slot + name;
        if (now[name] && !prev[name]) {
          SG.Audio.unlock();
          game.touchUI = false;
          game.keyDown(code, false);
          held[name] = 0;
        } else if (now[name]) {
          // menu auto-repeat for directions (matches never see repeats)
          held[name]++;
          if (['Up', 'Down', 'Left', 'Right'].includes(name) && game.top() !== 'play' && held[name] > 22 && (held[name] - 22) % 6 === 0) {
            game.keyDown(code, true);
          }
        } else if (prev[name]) game.keyUp(code);
      }
      padPrev[slot] = now;
    }
  }

  // Opened from a shared room link: …/?room=1234
  try {
    const room = new URLSearchParams(location.search).get('room');
    if (room && SG.validRoomCode(room)) {
      game.autoJoin(room);
      history.replaceState(null, '', location.pathname); // a reload should not re-join
    }
  } catch (e) {
    /* no URL params */
  }

  // ---------------------------------------------------------------- loop
  let last = performance.now();
  let acc = 0;
  let fps = 0;
  let frames = 0;
  let fpsTime = last;

  function render(alpha, dt) {
    ctx.setTransform(backing, 0, 0, backing, 0, 0);
    ctx.imageSmoothingEnabled = true;
    const s = game.session;
    const top = game.top();
    UI_NAMES();
    if (s && game.inMatchStack()) {
      const w = s.world;
      const stepping = top === 'play' || top === 'results';
      const a = stepping ? alpha : 1;
      SG.updateCamera(pres.cam, w.players, stepping ? dt : 0);
      SG.drawWorld(ctx, w, pres.cam, pres.vis, a, {
        shake: game.settings.shake, labels: game.settings.labels, names: SG.UI.names, debug: game.debug, uiTicks: game.uiTicks,
      });
      SG.drawHud(ctx, w, pres.hud, SG.UI.names, game.uiTicks);
      if (s.online) {
        const rtt = game.net && game.net.rtt >= 0 ? `  ${Math.round(game.net.rtt)} ms` : '';
        const y = s.world.opts.bestOf > 1 ? 78 : 64; // below the round pips
        SG.text(ctx, SG.t('onlineTag') + rtt, VW / 2, y, { size: 9, weight: 'bold', color: 'rgba(170,255,200,0.95)', stroke: 'rgba(0,0,0,0.6)', strokeWidth: 3 });
      }
      if (top === 'play' && game.touchUI) SG.UI.drawTouch(ctx, game, touchDown);
      if (top !== 'play') SG.UI.draw(ctx, game, game.uiTicks, true);
      else SG.UI.rects = [];
    } else {
      SG.UI.draw(ctx, game, game.uiTicks, false);
    }
    if (game.debug) SG.drawDebug(ctx, game, fps);
  }
  function UI_NAMES() { SG.UI.names = names(); }

  function frame(now) {
    const dt = Math.min(now - last, 250); // clamp after tab switches (no catch-up spiral)
    last = now;
    acc += dt;
    while (acc >= C.TICK_MS) {
      pollPads();
      if (fingers.size || touchDown.size) syncTouch();
      game.tick();
      if (!game.inMatchStack()) SG.UI.tick();
      acc -= C.TICK_MS;
    }
    frames++;
    if (now - fpsTime >= 1000) {
      fps = frames;
      frames = 0;
      fpsTime = now;
    }
    render(acc / C.TICK_MS, dt / 1000);
    requestAnimationFrame(frame);
  }

  fitCanvas();
  canvas.focus();
  requestAnimationFrame(frame);
})();

</script>
<script>
  // If the js/ folder is missing (e.g. index.html opened alone or from inside a ZIP), explain instead of a blank page.
  if (!(window.SG && window.SG.Game && window.game instanceof window.SG.Game)) {
    document.body.innerHTML = '<div style="color:#fff;font:16px/1.6 sans-serif;max-width:640px;padding:24px">' +
      '<h2>Stomp Duel could not load its files</h2>' +
      '<p>The <b>js</b> folder next to index.html is missing. If you downloaded a ZIP, right-click it → <b>Extract All</b>, ' +
      'then open index.html from the extracted folder. Or open <b>StompDuel.html</b>, which works on its own.</p>' +
      '<p>ゲームのファイルを読み込めませんでした。ZIP の場合は「すべて展開」してから index.html を開くか、' +
      '単体で動く <b>StompDuel.html</b> を開いてください。</p></div>';
  }
</script>
</body>
