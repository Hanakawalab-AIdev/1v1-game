// ---- js/core.js
// core.js — shared namespace, competitive constants and small utilities.
// Loaded first. Works both in the browser (classic <script>) and in Node (tests).
(function (root) {
  'use strict';
  const SG = (root.SG = root.SG || {});

  SG.GAME_TITLE = 'STOMP DUEL';

  // ===== Competitive rules (values identical to the Day 1 prototype) =====
  SG.C = Object.freeze({
    TICK_RATE: 60,               // physics always runs at 60 ticks/s (no monitor advantage)
    TICK_MS: 1000 / 60,
    COUNTDOWN_TICKS: 180,        // 3 s before each round, no control
    RESPAWN_INVULN: 90,          // 1.5 s of invulnerability after respawn
    ROUND_END_TICKS: 120,        // celebration pause after a round/match is decided
    GRAVITY: 0.6,
    MAX_FALL: 14,
    MOVE_SPEED: 4,
    JUMP_POWER: 12,
    JUMP_CUT: 0.5,               // applied every tick while rising with jump released
    STOMP_BOUNCE: 9,
    STOMP_TOLERANCE: 4,
    COYOTE_TICKS: 6,
    JUMP_BUFFER_TICKS: 6,
    PLAYER_W: 30,
    PLAYER_H: 40,
    PLATFORM_H: 12,
    VIEW_W: 800,
    VIEW_H: 400,
  });

  SG.NO_INPUT = Object.freeze({ left: false, right: false, jumpHeld: false, jumpPressed: false });

  SG.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  SG.lerp = (a, b, t) => a + (b - a) * t;

  // Seeded PRNG (mulberry32). Used only by AI decisions and cosmetic effects — never by physics.
  SG.makeRng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  // Deterministic hash → [0,1) for procedural cosmetic details (window lights, flowers...).
  SG.hash01 = function (n) {
    let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
    x ^= x >>> 13;
    x = Math.imul(x, 0xc2b2ae35);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
// ---- js/sim.js
// sim.js — deterministic match simulation. No DOM, no randomness, no wall-clock time.
// Every call to stepWorld() advances exactly one 1/60 s tick from explicit per-player inputs.
// Player physics and player-vs-player rules are identical to the Day 1 prototype;
// the only additions are moving-platform carrying, rounds/timer and presentation events.
(function (root) {
  'use strict';
  const SG = root.SG;
  const C = SG.C;
  const clamp = SG.clamp;

  // ===== Stage / platforms =====
  function motionOffset(m, time) {
    const t = (((time + m.phase) % m.period) + m.period) % m.period;
    const u = t / m.period;
    const tri = u < 0.5 ? u * 2 : 2 - u * 2;
    return m.range * (tri * tri * (3 - 2 * tri)); // smoothstep ping-pong in [0, range]
  }

  function placePlatform(pl, time) {
    if (!pl.move) {
      pl.x = pl.baseX;
      pl.y = pl.baseY;
    } else if (pl.move.axis === 'x') {
      pl.x = pl.baseX + pl.move.dir * motionOffset(pl.move, time);
      pl.y = pl.baseY;
    } else {
      pl.x = pl.baseX;
      pl.y = pl.baseY - motionOffset(pl.move, time);
    }
  }

  SG.buildStage = function (def) {
    const W = def.width;
    const platforms = [];
    const add = (src, mirrored) => {
      const x = mirrored ? W - src.x - src.w : src.x;
      const move = src.move
        ? {
            axis: src.move.axis,
            range: src.move.range,
            period: src.move.period,
            phase: src.move.phase || 0,
            dir: src.move.axis === 'x' && mirrored ? -1 : 1,
          }
        : null;
      platforms.push({ baseX: x, baseY: src.y, w: src.w, h: C.PLATFORM_H, move, x, y: src.y, prevX: x, prevY: src.y, dx: 0, dy: 0 });
    };
    for (const p of def.platforms) {
      add(p, false);
      if (p.mirror) add(p, true);
    }
    const stage = {
      def,
      id: def.id,
      width: W,
      groundY: def.groundY,
      platforms,
      spawns: [def.spawnX, W - def.spawnX - C.PLAYER_W],
      scrolling: W > C.VIEW_W,
    };
    SG.resetPlatforms(stage, 0);
    return stage;
  };

  SG.resetPlatforms = function (stage, time) {
    for (const pl of stage.platforms) {
      placePlatform(pl, time);
      pl.prevX = pl.x;
      pl.prevY = pl.y;
      pl.dx = 0;
      pl.dy = 0;
    }
  };

  SG.updatePlatforms = function (stage, time) {
    for (const pl of stage.platforms) {
      pl.prevX = pl.x;
      pl.prevY = pl.y;
      placePlatform(pl, time);
      pl.dx = pl.x - pl.prevX;
      pl.dy = pl.y - pl.prevY;
    }
  };

  // ===== Players =====
  SG.createPlayer = function (index, stage) {
    const p = { index, w: C.PLAYER_W, h: C.PLAYER_H, score: 0, invuln: 0 };
    SG.spawnPlayer(p, stage);
    return p;
  };

  SG.spawnPlayer = function (p, stage) {
    p.x = stage.spawns[p.index];
    p.y = stage.groundY - p.h;
    p.vx = 0;
    p.vy = 0;
    p.onGround = true;
    p.facing = p.index === 0 ? 1 : -1;
    p.coyote = C.COYOTE_TICKS;
    p.jumpBuffer = 0;
    p.riding = -1;
    p.prevBottom = p.y + p.h;
  };

  // One player's movement: input → velocity → position → terrain. (Same order as Day 1.)
  SG.stepPlayer = function (p, input, stage, canAct, ev) {
    const wasGround = p.onGround;

    // Moving platform carry (before own movement, so a rider keeps their footing).
    if (p.riding >= 0) {
      const pl = stage.platforms[p.riding];
      p.x += pl.dx;
      p.y = pl.y - p.h;
    }
    p.x = clamp(p.x, 0, stage.width - p.w);
    p.prevBottom = p.y + p.h;

    p.vx = 0;
    if (canAct && input.left) p.vx -= C.MOVE_SPEED;
    if (canAct && input.right) p.vx += C.MOVE_SPEED;
    if (p.vx !== 0) p.facing = Math.sign(p.vx);
    p.x = clamp(p.x + p.vx, 0, stage.width - p.w);

    if (canAct && input.jumpPressed) p.jumpBuffer = C.JUMP_BUFFER_TICKS;
    if (p.jumpBuffer > 0 && p.coyote > 0) {
      p.vy = -C.JUMP_POWER;
      p.onGround = false;
      p.coyote = 0;
      p.jumpBuffer = 0;
      if (ev) ev.push({ type: 'jump', who: p.index });
    }
    if (!input.jumpHeld && p.vy < 0) p.vy *= C.JUMP_CUT;

    p.vy = Math.min(p.vy + C.GRAVITY, C.MAX_FALL);
    p.y += p.vy;

    const rodeOn = p.riding;
    const impact = p.vy;
    p.onGround = false;
    p.riding = -1;
    const bottom = p.y + p.h;
    if (bottom >= stage.groundY) {
      p.y = stage.groundY - p.h;
      p.vy = 0;
      p.onGround = true;
    } else if (p.vy >= 0) {
      // One-way platforms: land only when coming from above (pass through from below).
      let best = -1;
      for (let i = 0; i < stage.platforms.length; i++) {
        const pl = stage.platforms[i];
        if (!(p.x + p.w > pl.x && p.x < pl.x + pl.w)) continue;
        const topBefore = i === rodeOn ? pl.y : pl.prevY;
        if (p.prevBottom <= topBefore && bottom >= pl.y && (best < 0 || pl.y < stage.platforms[best].y)) best = i;
      }
      if (best >= 0) {
        p.y = stage.platforms[best].y - p.h;
        p.vy = 0;
        p.onGround = true;
        p.riding = best;
      }
    }
    if (ev && p.onGround && !wasGround) ev.push({ type: 'land', who: p.index, speed: impact });

    p.coyote = p.onGround ? C.COYOTE_TICKS : Math.max(0, p.coyote - 1);
    p.jumpBuffer = Math.max(0, p.jumpBuffer - 1);
    if (p.invuln > 0) p.invuln--;
  };

  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  SG.overlaps = overlaps;

  // Stomp: was above the victim's head last tick, is falling, and the victim is not invulnerable.
  const isStomp = (top, bottom) => top.vy > 0 && top.prevBottom <= bottom.y + C.STOMP_TOLERANCE && bottom.invuln === 0;
  SG.isStomp = isStomp;

  // Player-vs-player, evaluated once after BOTH players moved (no update-order advantage).
  SG.resolvePlayers = function (a, b, stage, ev) {
    if (!overlaps(a, b)) return null;
    const aStomps = isStomp(a, b);
    const bStomps = isStomp(b, a);
    if (aStomps !== bStomps) {
      const top = aStomps ? a : b;
      const bottom = aStomps ? b : a;
      const hitX = bottom.x + bottom.w / 2;
      const hitY = bottom.y;
      const victimFacing = bottom.facing;
      top.vy = -C.STOMP_BOUNCE;
      top.onGround = false;
      top.coyote = 0;
      top.riding = -1;
      SG.spawnPlayer(bottom, stage);
      bottom.invuln = C.RESPAWN_INVULN;
      if (ev) ev.push({ type: 'stomp', top: top.index, bottom: bottom.index, x: hitX, y: hitY, facing: victimFacing });
      return { top: top.index, bottom: bottom.index };
    }
    // Not a stomp → push apart by half the overlap each (fair).
    const overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const dir = a.x + a.w / 2 <= b.x + b.w / 2 ? -1 : 1;
    a.x += (dir * overlapX) / 2;
    b.x -= (dir * overlapX) / 2;
    a.x = clamp(a.x, 0, stage.width - a.w);
    b.x = clamp(b.x, 0, stage.width - b.w);
    if (ev) ev.push({ type: 'bump', x: (a.x + b.x + a.w) / 2, y: Math.max(a.y, b.y) + 20, strength: overlapX });
    return null;
  };

  // ===== Match / rounds =====
  // opts: { stageId, mode, winScore (0 = endless), bestOf (1/3/5), timeLimit (s, 0 = off), cpuLevel }
  SG.createWorld = function (opts) {
    const o = Object.assign({ stageId: 'meadow', mode: 'versus', winScore: 5, bestOf: 1, timeLimit: 0, cpuLevel: 3 }, opts || {});
    const stage = SG.buildStage(SG.getStageDef(o.stageId));
    const w = {
      opts: o,
      stage,
      players: [SG.createPlayer(0, stage), SG.createPlayer(1, stage)],
      roundWins: [0, 0],
      round: 1,
      matchWinner: -1,
      totalTicks: 0,
      stats: { stomps: [0, 0], longestStreak: [0, 0], streak: [0, 0] },
      events: [],
    };
    startRound(w);
    return w;
  };

  SG.roundsToWin = (w) => Math.ceil((w.opts.bestOf || 1) / 2);

  function startRound(w) {
    w.phase = 'countdown';
    w.countdown = C.COUNTDOWN_TICKS;
    w.tick = 0;
    w.time = 0;
    w.phaseTimer = 0;
    w.suddenDeath = false;
    w.roundWinner = -1;
    w.endReason = '';
    w.stats.streak = [0, 0];
    SG.resetPlatforms(w.stage, 0);
    for (const p of w.players) {
      p.score = 0;
      p.invuln = 0;
      SG.spawnPlayer(p, w.stage);
    }
    w.events.push({ type: 'roundStart', round: w.round });
  }

  function endRound(w, winner, reason) {
    w.phase = 'roundEnd';
    w.phaseTimer = 0;
    w.roundWinner = winner;
    w.endReason = reason;
    w.roundWins[winner]++;
    if (w.roundWins[winner] >= SG.roundsToWin(w)) w.matchWinner = winner;
    w.events.push({ type: 'roundEnd', winner, reason, matchOver: w.matchWinner >= 0 });
  }

  SG.stepWorld = function (w, inputs) {
    w.events = [];
    const ev = w.events;

    if (w.phase === 'countdown') {
      w.countdown--;
      if (w.countdown <= 0) {
        w.phase = 'playing';
        ev.push({ type: 'go' });
      } else if (w.countdown % C.TICK_RATE === 0) {
        ev.push({ type: 'count', n: w.countdown / C.TICK_RATE });
      }
    } else if (w.phase === 'playing') {
      w.tick++;
      w.totalTicks++;
      const limit = (w.opts.timeLimit || 0) * C.TICK_RATE;
      if (limit > 0 && !w.suddenDeath && w.tick >= limit) {
        const [a, b] = w.players;
        if (a.score !== b.score) endRound(w, a.score > b.score ? 0 : 1, 'time');
        else {
          w.suddenDeath = true;
          ev.push({ type: 'suddenDeath' });
        }
      }
    } else {
      w.phaseTimer++;
    }

    const canAct = w.phase === 'playing';
    w.time++;
    SG.updatePlatforms(w.stage, w.time);
    const NO = SG.NO_INPUT;
    SG.stepPlayer(w.players[0], (inputs && inputs[0]) || NO, w.stage, canAct, ev);
    SG.stepPlayer(w.players[1], (inputs && inputs[1]) || NO, w.stage, canAct, ev);

    if (canAct) {
      const hit = SG.resolvePlayers(w.players[0], w.players[1], w.stage, ev);
      if (hit) {
        const top = w.players[hit.top];
        top.score++;
        const s = w.stats;
        s.stomps[hit.top]++;
        s.streak[hit.top]++;
        s.streak[hit.bottom] = 0;
        s.longestStreak[hit.top] = Math.max(s.longestStreak[hit.top], s.streak[hit.top]);
        ev.push({ type: 'score', who: hit.top, score: top.score });
        const winScore = w.opts.winScore || 0;
        if (w.suddenDeath) endRound(w, hit.top, 'sudden');
        else if (winScore > 0 && top.score >= winScore) endRound(w, hit.top, 'score');
      }
    }

    if (w.phase === 'roundEnd' && w.phaseTimer >= C.ROUND_END_TICKS) {
      if (w.matchWinner >= 0) {
        w.phase = 'matchEnd';
        w.phaseTimer = 0;
        ev.push({ type: 'matchEnd', winner: w.matchWinner });
      } else {
        w.round++;
        startRound(w);
      }
    }
    return ev;
  };

  // Compact state fingerprint for determinism tests and the debug overlay.
  SG.hashWorld = function (w) {
    const r = (v) => Math.round(v * 1e6) / 1e6;
    const ps = w.players.map((p) => [r(p.x), r(p.y), r(p.vx), r(p.vy), p.score, p.invuln, p.coyote, p.jumpBuffer, p.riding].join(','));
    return [w.phase, w.tick, w.time, w.round, w.roundWins.join('/'), ps.join('|')].join(';');
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
<script>
// ---- js/ai.js
// ai.js — CPU opponents. The AI produces the SAME input structure a human produces
// ({left, right, jumpHeld, jumpPressed}) and goes through the same physics as everyone else.
//
// Fairness:
//  - It sees the opponent only through a reaction-delay buffer of PAST snapshots.
//  - It never reads the opponent's inputs.
//  - It may "imagine" its own jump arcs with the public physics rules (like a player does), and
//    extrapolate the opponent from the last snapshot it saw (level 5) — it never sees future states.
//  - Difficulty changes reaction delay, decision rate, aim error, mistakes and strategy only.
(function (root) {
  'use strict';
  const SG = root.SG;
  const C = SG.C;

  // level 0 = practice dummy (walks around, never attacks)
  const LEVELS = {
    0: { react: 30, interval: 40, err: 0, mistake: 0, plan: false, predict: false, dodge: 0, climb: false, invulnAware: false, awareness: 0, randomJump: 0, nearJump: 0 },
    1: { react: 30, interval: 26, err: 70, mistake: 0.4, plan: false, predict: false, dodge: 0.05, climb: false, invulnAware: false, awareness: 260, randomJump: 0.1, nearJump: 0.25 },
    2: { react: 22, interval: 16, err: 40, mistake: 0.3, plan: false, predict: false, dodge: 0.2, climb: false, invulnAware: false, awareness: 900, randomJump: 0.06, nearJump: 0.5 },
    3: { react: 16, interval: 12, err: 22, mistake: 0.3, plan: true, options: 'basic', predict: false, dodge: 0.35, climb: true, invulnAware: false, awareness: 9999, randomJump: 0, nearJump: 0 },
    4: { react: 9, interval: 6, err: 12, mistake: 0.12, plan: true, options: 'normal', predict: true, dodge: 0.75, climb: true, invulnAware: true, awareness: 9999, randomJump: 0, nearJump: 0 },
    5: { react: 6, interval: 4, err: 5, mistake: 0.06, plan: true, options: 'full', predict: true, dodge: 0.9, climb: true, invulnAware: true, awareness: 9999, randomJump: 0, nearJump: 0 },
  };
  SG.AI_LEVELS = LEVELS;

  const snap = (p) => ({
    index: p.index, x: p.x, y: p.y, w: p.w, h: p.h, vx: p.vx, vy: p.vy, onGround: p.onGround,
    invuln: p.invuln, riding: p.riding, facing: p.facing, coyote: p.coyote, jumpBuffer: p.jumpBuffer,
    prevBottom: p.prevBottom, score: 0,
  });

  const mkInput = (dir, jumpHeld, jumpPressed) => ({ left: dir < 0, right: dir > 0, jumpHeld: !!jumpHeld, jumpPressed: !!jumpPressed });

  function cloneStage(stage) {
    return {
      width: stage.width,
      groundY: stage.groundY,
      platforms: stage.platforms.map((pl) => ({
        baseX: pl.baseX, baseY: pl.baseY, w: pl.w, h: pl.h, move: pl.move,
        x: pl.x, y: pl.y, prevX: pl.prevX, prevY: pl.prevY, dx: pl.dx, dy: pl.dy,
      })),
    };
  }

  function resetClone(clone, stage) {
    for (let i = 0; i < stage.platforms.length; i++) {
      const s = stage.platforms[i];
      const d = clone.platforms[i];
      d.x = s.x; d.y = s.y; d.prevX = s.prevX; d.prevY = s.prevY; d.dx = s.dx; d.dy = s.dy;
    }
  }

  function copyInto(dst, src) {
    for (const k in src) dst[k] = src[k];
    return dst;
  }

  SG.createAI = function (level, seed) {
    const cfg = LEVELS[level] || LEVELS[3];
    const rng = SG.makeRng((seed >>> 0) || 1);
    const hist = [];
    let plan = [];
    let nav = SG.NO_INPUT;
    let nextDecision = 0;
    let t = 0;
    let aimOffset = 0;
    let wanderTarget = -1;
    let stuck = 0;
    let lastX = -1;
    const ai = { level, cfg, mode: 'wait', planLen: 0, lastScore: 0 };

    ai.reset = function () {
      hist.length = 0;
      plan = [];
      nav = SG.NO_INPUT;
      nextDecision = 0;
      ai.mode = 'wait';
    };

    // Imagine one candidate action sequence for `ticks` ticks.
    function simulate(world, self, opp, cand, sc) {
      resetClone(sc, world.stage);
      const me = copyInto({}, self);
      const o = copyInto({}, opp);
      const inputs = [];
      const N = 48;
      let score = -1;
      for (let k = 0; k < N; k++) {
        const myCx = me.x + me.w / 2;
        const oCx = o.x + o.w / 2;
        let dir = cand.dir;
        if (k < cand.delay) dir = cand.walkDir;
        else if (cand.dir === 2) dir = Math.abs(oCx - myCx) < 4 ? 0 : Math.sign(oCx - myCx);
        const jk = k - cand.delay;
        const input = mkInput(dir, cand.jump ? jk >= 0 && jk < cand.hold : k < cand.hold, cand.jump && jk === 0);
        inputs.push(input);
        SG.updatePlatforms(sc, world.time + 1 + k);
        SG.stepPlayer(me, input, sc, true, null);
        if (cfg.predict) SG.stepPlayer(o, mkInput(Math.sign(o.vx), o.vy < 0, false), sc, true, null);
        else if (o.invuln > 0) o.invuln--;
        if (SG.overlaps(me, o)) {
          const iHit = me.vy > 0 && me.prevBottom <= o.y + C.STOMP_TOLERANCE;
          const theyHit = cfg.predict && o.vy > 0 && o.prevBottom <= me.y + C.STOMP_TOLERANCE && me.invuln <= k;
          if (theyHit && !iHit) { score = -1000; break; }
          if (iHit) {
            if (o.invuln > 0 && cfg.invulnAware) { score = -50; break; }
            score = 1000 - k * 8 - cand.delay * 2;
            inputs.length = k + 1;
            break;
          }
        }
      }
      return { score, inputs };
    }

    function candidates(grounded, self) {
      const out = [];
      // Decision quality scales with level: more imagined options at higher levels.
      const opt = cfg.options === 'full'
        ? { delays: [0, 5, 10], holds: [3, 8, 14, 30], dirs: [2, -1, 1, 0] }
        : cfg.options === 'normal'
          ? { delays: [0, 6], holds: [4, 10, 30], dirs: [2, -1, 1] }
          : { delays: [0], holds: [10, 30], dirs: [2] };
      if (grounded) {
        for (const delay of opt.delays) {
          for (const hold of opt.holds) {
            for (const dir of opt.dirs) out.push({ jump: true, delay, hold, dir, walkDir: 2 === dir ? 0 : dir });
          }
        }
        out.push({ jump: false, delay: 0, hold: 0, dir: 2, walkDir: 0 });
        out.push({ jump: false, delay: 0, hold: 0, dir: -1, walkDir: -1 });
        out.push({ jump: false, delay: 0, hold: 0, dir: 1, walkDir: 1 });
      } else {
        const holdNow = self.vy < 0 ? 30 : 0;
        for (const dir of [2, -1, 1, 0]) {
          out.push({ jump: false, delay: 0, hold: holdNow, dir, walkDir: dir });
          if (holdNow) out.push({ jump: false, delay: 0, hold: 0, dir, walkDir: dir });
        }
      }
      // walkDir for "delay" phases of homing plans: walk toward the opponent
      for (const c of out) if (c.dir === 2) c.walkDir = 3;
      return out;
    }

    function fixWalkDir(cands, self, opp) {
      const d = Math.sign(opp.x + opp.w / 2 - (self.x + self.w / 2));
      for (const c of cands) if (c.walkDir === 3) c.walkDir = d;
    }

    function startJumpPlan(dirFn, hold, len) {
      plan = [];
      for (let k = 0; k < len; k++) plan.push({ dirFn, hold, k });
    }

    function walkInput(self, goalX, dead) {
      const d = goalX - (self.x + self.w / 2);
      return mkInput(Math.abs(d) < (dead || 6) ? 0 : Math.sign(d), false, false);
    }

    function decide(world, self, opp, me) {
      const stage = world.stage;
      const myCx = self.x + self.w / 2;
      const oCx = opp.x + opp.w / 2;
      const dx = oCx - myCx;
      const myBottom = self.y + self.h;
      const oBottom = opp.y + opp.h;
      const grounded = self.onGround || self.coyote > 0;
      aimOffset = (rng() * 2 - 1) * cfg.err;

      // --- Practice dummy: wander between random points, never jump.
      if (level === 0) {
        if (wanderTarget < 0 || Math.abs(wanderTarget - myCx) < 8 || rng() < 0.15) wanderTarget = 40 + rng() * (stage.width - 80);
        nav = rng() < 0.3 ? SG.NO_INPUT : walkInput(self, wanderTarget, 8);
        ai.mode = 'wander';
        return;
      }

      // --- Defence: avoid being under a falling opponent, and avoid an invulnerable one.
      const meSafe = cfg.invulnAware && self.invuln > 15;
      const above = oBottom < self.y + 10 && Math.abs(dx) < 80 && opp.vy > -4 && self.y - oBottom < 170;
      const dangerous = cfg.invulnAware && opp.invuln > 15 && Math.abs(dx) < 150 && oBottom <= myBottom + 20;
      if (!meSafe && (above || dangerous) && rng() < cfg.dodge) {
        let away = dx > 0 ? -1 : 1;
        if (dx === 0) away = myCx < stage.width / 2 ? 1 : -1;
        if ((away < 0 && self.x < 30) || (away > 0 && self.x > stage.width - self.w - 30)) away = -away;
        nav = mkInput(away, false, false);
        ai.mode = 'evade';
        return;
      }

      // --- Limited awareness (level 1): wander if the opponent is far away.
      if (Math.abs(dx) > cfg.awareness) {
        if (wanderTarget < 0 || Math.abs(wanderTarget - myCx) < 10) wanderTarget = 40 + rng() * (stage.width - 80);
        nav = walkInput(self, wanderTarget);
        if (grounded && rng() < cfg.randomJump) startJumpPlan(() => (nav.left ? -1 : nav.right ? 1 : 0), 10 + Math.floor(rng() * 20), 30);
        ai.mode = 'wander';
        return;
      }

      // --- Attack planning (levels 3–5): imagine jump arcs and commit to the best stomp.
      if (cfg.plan && !(opp.invuln > 10 && cfg.invulnAware)) {
        let o = opp;
        if (cfg.predict) {
          // Extrapolate the stale observation forward by the reaction delay using public physics.
          const sc0 = cloneStage(stage);
          o = copyInto({}, opp);
          for (let k = 0; k < cfg.react; k++) {
            SG.updatePlatforms(sc0, world.time - cfg.react + 1 + k);
            SG.stepPlayer(o, mkInput(Math.sign(o.vx), o.vy < 0, false), sc0, true, null);
          }
        }
        const sc = cloneStage(stage);
        const cands = candidates(grounded, self);
        fixWalkDir(cands, self, o);
        let best = null;
        let danger = false;
        let safest = null;
        for (const c of cands) {
          const r = simulate(world, self, o, c, sc);
          if (r.score === -1000) danger = true;
          if (!best || r.score > best.score) best = r;
          // safest non-attacking option: prefer not jumping / small moves (first listed wins ties)
          if (r.score > -1000 && (!safest || r.score > safest.score)) safest = r;
        }
        ai.lastScore = best ? best.score : 0;
        if (best && best.score <= 0 && danger && safest && rng() < cfg.dodge) {
          // Some imagined futures end with me being stomped: take the safest one for a moment.
          plan = safest.inputs.slice(0, 10);
          ai.mode = 'defend';
          return;
        }
        if (best && best.score > 0) {
          if (rng() < cfg.mistake) {
            // Mistimed: hesitate a few ticks before executing.
            const wait = 3 + Math.floor(rng() * 10);
            plan = [];
            for (let k = 0; k < wait; k++) plan.push(SG.NO_INPUT);
            plan = plan.concat(best.inputs);
          } else {
            plan = best.inputs.slice();
          }
          ai.mode = 'attack';
          return;
        }
      }

      // --- Simple attack (levels 1–2): jump when close and roughly level.
      const adx = Math.abs(dx + aimOffset * 0.3);
      if (!cfg.plan && grounded && adx > 34 && adx < 110 && Math.abs(oBottom - myBottom) < 30) {
        if (rng() < cfg.nearJump) {
          startJumpPlan(null, 6 + Math.floor(rng() * 9), 40);
          ai.mode = 'attack';
          return;
        }
      }

      // --- Navigation.
      let goalX = oCx + aimOffset;
      ai.mode = 'chase';
      if (oBottom < myBottom - 30) {
        if (cfg.climb) {
          // Find a reachable platform (they are one-way: jump up through it from below).
          let bestPl = null;
          let bestCost = Infinity;
          for (const pl of stage.platforms) {
            if (pl.y >= myBottom - 8 || pl.y < myBottom - 112) continue;
            const pc = pl.x + pl.w / 2;
            const cost = Math.abs(pc - oCx) + Math.abs(pl.y - oBottom) * 0.6 + Math.abs(pc - myCx) * 0.4;
            if (cost < bestCost) { bestCost = cost; bestPl = pl; }
          }
          if (bestPl) {
            const inside = myCx > bestPl.x + 8 && myCx < bestPl.x + bestPl.w - 8;
            const near = myCx > bestPl.x - 40 && myCx < bestPl.x + bestPl.w + 40;
            if (grounded && (inside || near)) {
              const target = SG.clamp(oCx, bestPl.x + 12, bestPl.x + bestPl.w - 12);
              startJumpPlan((s) => {
                const d = target - (s.x + s.w / 2);
                return Math.abs(d) < 5 ? 0 : Math.sign(d);
              }, 30, 36);
              ai.mode = 'climb';
              return;
            }
            goalX = SG.clamp(myCx, bestPl.x + 15, bestPl.x + bestPl.w - 15);
            ai.mode = 'climb';
          }
        } else if (grounded && rng() < 0.3 && Math.abs(dx) < 140) {
          startJumpPlan(null, 30, 36);
          ai.mode = 'hop';
          return;
        }
      } else if (oBottom > myBottom + 30 && self.riding >= 0) {
        // Opponent is below: walk off the platform edge closest to them.
        const pl = stage.platforms[self.riding];
        if (Math.abs(dx) < pl.w) goalX = dx < 0 ? pl.x - 20 : pl.x + pl.w + 20;
        ai.mode = 'drop';
      }
      nav = walkInput(self, goalX);
      if (!cfg.plan && grounded && rng() < cfg.randomJump) startJumpPlan(null, 8 + Math.floor(rng() * 22), 30);
    }

    // Called once per simulation tick for player index `me`.
    ai.think = function (world, me) {
      const self = world.players[me];
      const oppNow = world.players[1 - me];
      hist.push(snap(oppNow));
      if (hist.length > 64) hist.shift();
      t++;
      if (world.phase !== 'playing') {
        plan = [];
        nav = SG.NO_INPUT;
        nextDecision = t + Math.floor(cfg.react / 2);
        ai.mode = 'wait';
        return SG.NO_INPUT;
      }
      const opp = hist[Math.max(0, hist.length - 1 - cfg.react)];

      // Unstick: walking into a wall for a while → hop.
      if (Math.abs(self.x - lastX) < 0.01 && (nav.left || nav.right) && plan.length === 0) stuck++;
      else stuck = 0;
      lastX = self.x;
      if (stuck > 20 && (self.onGround || self.coyote > 0) && level > 0) {
        stuck = 0;
        startJumpPlan(null, 30, 30);
      }

      const replan = cfg.plan && level >= 4 && t >= nextDecision;
      if (plan.length && !(replan && ai.mode !== 'attack')) {
        const step = plan.shift();
        ai.planLen = plan.length;
        if (step && step.k !== undefined) {
          // Lazily evaluated jump plan step.
          const myCx = self.x + self.w / 2;
          const d = step.dirFn ? step.dirFn(self) : Math.abs(opp.x + opp.w / 2 - myCx) < 5 ? 0 : Math.sign(opp.x + opp.w / 2 - myCx);
          return mkInput(d, step.k < step.hold, step.k === 0);
        }
        return step;
      }
      if (t >= nextDecision) {
        plan = [];
        nextDecision = t + cfg.interval + Math.floor(rng() * Math.max(1, cfg.interval / 2));
        decide(world, self, opp, me);
        if (plan.length) return ai.think.continuePlan(self, opp);
      }
      ai.planLen = plan.length;
      return { left: nav.left, right: nav.right, jumpHeld: false, jumpPressed: false };
    };

    ai.think.continuePlan = function (self, opp) {
      const step = plan.shift();
      ai.planLen = plan.length;
      if (step && step.k !== undefined) {
        const myCx = self.x + self.w / 2;
        const d = step.dirFn ? step.dirFn(self) : Math.abs(opp.x + opp.w / 2 - myCx) < 5 ? 0 : Math.sign(opp.x + opp.w / 2 - myCx);
        return mkInput(d, step.k < step.hold, step.k === 0);
      }
      return step || SG.NO_INPUT;
    };

    return ai;
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
// ---- js/net.js
// net.js — network protocol shared by the browser client and the Node server (DOM-free).
//
// Netcode model ("server-clocked input relay"):
//   * Each device sends its own player's input (held buttons + a jump-press counter) to the server.
//   * The server owns the 60 Hz clock. Every tick it takes the latest input of both players, steps its
//     own copy of the deterministic simulation, and broadcasts that tick's two inputs to both devices.
//   * Both devices run the same simulation from the same input stream, so they show the same match.
//     Every HASH_EVERY ticks the server attaches a state fingerprint; a device that disagrees asks for
//     the full state (resync).
//   * Both players' inputs go through the same server hop, so neither side gets a latency advantage
//     from hosting.
(function (root) {
  'use strict';
  const SG = root.SG;

  SG.NET = Object.freeze({
    PROTOCOL: 1,
    HASH_EVERY: 60, // ticks between state fingerprints
    CODE_LEN: 4, // room codes are 4 digits
    START_BUFFER: 2, // frames a device collects before it starts playing them
    CATCH_UP: 6, // above this many queued frames, play 2 per tick
    FAST_FORWARD: 20, // above this many, jump to the newest frames
    PING_EVERY: 120, // ticks between latency measurements
    POST_MATCH_TICKS: 90, // the server keeps ticking this long after matchEnd (results animations)
  });

  const BIT_LEFT = 1;
  const BIT_RIGHT = 2;
  const BIT_HELD = 4;
  const BIT_PRESSED = 8;

  // Held buttons → bits (what a device sends).
  SG.packHeld = function (inp) {
    return (inp.left ? BIT_LEFT : 0) | (inp.right ? BIT_RIGHT : 0) | (inp.jumpHeld ? BIT_HELD : 0);
  };
  // One player's input for one tick → bits (what the server broadcasts).
  SG.packInput = function (inp) {
    return SG.packHeld(inp) | (inp.jumpPressed ? BIT_PRESSED : 0);
  };
  SG.unpackInput = function (bits) {
    return {
      left: (bits & BIT_LEFT) !== 0,
      right: (bits & BIT_RIGHT) !== 0,
      jumpHeld: (bits & BIT_HELD) !== 0,
      jumpPressed: (bits & BIT_PRESSED) !== 0,
    };
  };

  SG.validRoomCode = function (code) {
    return typeof code === 'string' && /^[0-9]{4}$/.test(code);
  };

  // The server only accepts these rules (same choices as the local match setup).
  SG.sanitizeOnlineOpts = function (o) {
    o = o && typeof o === 'object' ? o : {};
    const int = (v, lo, hi, def) => (Number.isInteger(v) && v >= lo && v <= hi ? v : def);
    return {
      stageId: SG.STAGES.some((s) => s.id === o.stageId) ? o.stageId : 'meadow',
      mode: 'online',
      winScore: int(o.winScore, 1, 10, 5),
      bestOf: [1, 3, 5].includes(o.bestOf) ? o.bestOf : 1,
      timeLimit: [0, 60, 90, 120].includes(o.timeLimit) ? o.timeLimit : 0,
      cpuLevel: null,
    };
  };
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
// ---- js/game.js
// game.js — application state machine (screens, match sessions, pause, settings, input routing).
// DOM-free: presentation (audio, effects, display) is reached only through `hooks`, so the whole
// flow can be driven by tests in Node.
(function (root) {
  'use strict';
  const SG = root.SG;
  const C = SG.C;

  const DEFAULT_KEYS = {
    p1: { left: 'KeyA', right: 'KeyD', jump: 'KeyW' },
    p2: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp' },
  };
  const RESERVED_KEYS = ['Escape', 'F1'];

  SG.defaultSettings = function (lang) {
    return {
      version: 1,
      musicVol: 6,
      sfxVol: 8,
      mute: false,
      battleMusic: true,
      shake: true,
      labels: true,
      scale: 'fit', // 'fit' | 1 | 2
      lang: lang || 'en',
      keys: JSON.parse(JSON.stringify(DEFAULT_KEYS)),
      setup: { mode: 'versus', winScore: 5, bestOf: 1, timer: 0, cpuLevel: 3, practiceOpp: 0, stageId: 'meadow' },
    };
  };

  // Merge stored settings over defaults, validating every field (corrupt storage never breaks the game).
  SG.sanitizeSettings = function (raw, lang) {
    const d = SG.defaultSettings(lang);
    if (!raw || typeof raw !== 'object') return d;
    const int = (v, lo, hi, def) => (Number.isInteger(v) && v >= lo && v <= hi ? v : def);
    const bool = (v, def) => (typeof v === 'boolean' ? v : def);
    d.musicVol = int(raw.musicVol, 0, 10, d.musicVol);
    d.sfxVol = int(raw.sfxVol, 0, 10, d.sfxVol);
    d.mute = bool(raw.mute, d.mute);
    d.battleMusic = bool(raw.battleMusic, d.battleMusic);
    d.shake = bool(raw.shake, d.shake);
    d.labels = bool(raw.labels, d.labels);
    d.scale = ['fit', 1, 2].includes(raw.scale) ? raw.scale : d.scale;
    d.lang = SG.LANGS.includes(raw.lang) ? raw.lang : d.lang;
    if (raw.keys && typeof raw.keys === 'object') {
      for (const pl of ['p1', 'p2']) {
        for (const a of ['left', 'right', 'jump']) {
          const v = raw.keys[pl] && raw.keys[pl][a];
          if (typeof v === 'string' && v.length < 40 && !RESERVED_KEYS.includes(v)) d.keys[pl][a] = v;
        }
      }
      const all = ['p1', 'p2'].flatMap((pl) => ['left', 'right', 'jump'].map((a) => d.keys[pl][a]));
      if (new Set(all).size !== all.length) d.keys = JSON.parse(JSON.stringify(DEFAULT_KEYS));
    }
    const s = raw.setup || {};
    d.setup.mode = ['versus', 'cpu', 'practice', 'online'].includes(s.mode) ? s.mode : d.setup.mode;
    d.setup.winScore = int(s.winScore, 1, 10, d.setup.winScore);
    d.setup.bestOf = [1, 3, 5].includes(s.bestOf) ? s.bestOf : d.setup.bestOf;
    d.setup.timer = [0, 60, 90, 120].includes(s.timer) ? s.timer : d.setup.timer;
    d.setup.cpuLevel = int(s.cpuLevel, 1, 5, d.setup.cpuLevel);
    d.setup.practiceOpp = s.practiceOpp === 'human' ? 'human' : int(s.practiceOpp, 0, 5, d.setup.practiceOpp);
    d.setup.stageId = SG.STAGES.some((st) => st.id === s.stageId) ? s.stageId : d.setup.stageId;
    return d;
  };

  const NAV = {
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    ok: ['Enter', 'NumpadEnter', 'Space'],
    back: ['Escape', 'Backspace'],
  };
  // Gamepads arrive as virtual key codes "Pad<slot><Button>" (see main.js): D-pad/stick, A, B, Start.
  const PAD_NAV = { Up: 'up', Down: 'down', Left: 'left', Right: 'right', A: 'ok', Start: 'ok', B: 'back' };
  const PAD_RE = /^Pad([01])(Up|Down|Left|Right|A|B|Start)$/;
  const isVirtual = (code) => /^(Pad|Touch)/.test(code);
  const navOf = (code) => {
    for (const k in NAV) if (NAV[k].includes(code)) return k;
    const m = PAD_RE.exec(code);
    return m ? PAD_NAV[m[2]] : null;
  };
  const isPauseKey = (code) => code === 'Escape' || code === 'TouchPause' || /^Pad[01]Start$/.test(code);
  const DIGIT_RE = /^(?:Digit|Numpad)([0-9])$/;
  // On-screen keypad of the Join Room screen (row-major, 3 columns).
  SG.JOIN_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];

  const OVERLAY_LOCK_TICKS = 30; // ignore menu input right after an overlay appears mid-action
  const noop = () => {};

  SG.Game = function (hooks) {
    const h = Object.assign(
      {
        sfx: noop, music: noop, duck: noop, applyAudio: noop, applyDisplay: noop,
        toggleFullscreen: noop, isFullscreen: () => false,
        load: () => null, save: noop,
        onMatchStart: noop, onWorldEvents: noop, onTick: noop,
        // Online: netConnect(onMessage, onClose) → { send(obj), close() } or null when no server is reachable.
        netConnect: null, now: () => 0, shareUrls: () => [], copyText: () => false,
      },
      hooks || {}
    );
    const g = this;
    g.hooks = h;
    g.settings = SG.sanitizeSettings(h.load(), h.defaultLang);
    SG.lang = g.settings.lang;
    g.stack = ['title'];
    g.cursor = {};
    g.keys = Object.create(null);
    g.pressed = Object.create(null);
    g.session = null;
    g.debug = false;
    g.capture = null;
    g.screenTicks = 0;
    g.uiTicks = 0;
    g.stageIndex = Math.max(0, SG.STAGES.findIndex((s) => s.id === g.settings.setup.stageId));
    g.howPage = 0;
    g.toast = null;
    g.focusPaused = false;
    g.matchCounter = 0;
    g.net = null; // online connection state (see "online" below)
    g.joinCode = '';
    g.joinCursor = 0;
    g.touchUI = false; // set by main.js once a touch screen is used
    g.serverHint = 0; // ticks left to flash the "start the server" instructions
    h.applyAudio(g.settings);
    h.applyDisplay(g.settings);
    g.updateMusic();
  };

  const P = SG.Game.prototype;

  // ---------------------------------------------------------------- screens
  P.top = function () { return this.stack[this.stack.length - 1]; };

  P.go = function (screen, replace) {
    if (replace) this.stack[this.stack.length - 1] = screen;
    else this.stack.push(screen);
    this.enterScreen();
  };
  P.back = function () {
    if (this.stack.length > 1) this.stack.pop();
    this.enterScreen();
  };
  P.reset = function (screen) {
    this.stack = [screen];
    this.enterScreen();
  };
  P.enterScreen = function () {
    this.screenTicks = 0;
    this.capture = null;
    this.clearPressed();
    const items = this.menuItems();
    if (items) {
      const top = this.top();
      if (this.cursor[top] === undefined || top === 'pause' || top === 'results') this.cursor[top] = this.defaultCursor(top, items);
      this.cursor[top] = Math.min(this.cursor[top], items.length - 1);
    }
    this.updateMusic();
  };
  P.defaultCursor = function (screen, items) {
    if (screen === 'setup') return items.findIndex((it) => it.id === 'next');
    return 0;
  };

  P.clearPressed = function () { this.pressed = Object.create(null); };
  P.releaseAll = function () {
    this.keys = Object.create(null);
    this.pressed = Object.create(null);
  };

  P.isMenuScreen = function (s) { return !['play', 'pause', 'results'].includes(s); };
  P.inMatchStack = function () { return this.stack.includes('play'); };

  P.updateMusic = function () {
    const top = this.top();
    let track = null;
    if (!this.inMatchStack()) track = 'menu';
    else if (this.stack.includes('results')) track = null;
    else if (this.settings.battleMusic && this.session && this.session.world.phase !== 'matchEnd' && !this.session.musicStopped) track = 'battle';
    this.hooks.music(track);
    this.hooks.duck(this.inMatchStack() && top !== 'play');
  };

  // ---------------------------------------------------------------- settings
  P.saveSettings = function () {
    this.settings.setup.stageId = SG.STAGES[this.stageIndex].id;
    this.hooks.save(JSON.parse(JSON.stringify(this.settings)));
  };
  P.changeSetting = function (key, value) {
    this.settings[key] = value;
    if (key === 'lang') SG.lang = value;
    this.hooks.applyAudio(this.settings);
    this.hooks.applyDisplay(this.settings);
    if (key === 'battleMusic') this.updateMusic();
    this.saveSettings();
  };
  P.resetSettings = function () {
    const lang = this.settings.lang;
    const setup = this.settings.setup;
    this.settings = SG.defaultSettings(lang);
    this.settings.setup = setup;
    SG.lang = lang;
    this.hooks.applyAudio(this.settings);
    this.hooks.applyDisplay(this.settings);
    this.updateMusic();
    this.saveSettings();
    this.toast = { text: SG.t('resetDone'), ticks: 120 };
  };
  P.bindKey = function (pl, action, code) {
    const k = this.settings.keys;
    const old = k[pl][action];
    for (const p2 of ['p1', 'p2']) {
      for (const a of ['left', 'right', 'jump']) {
        if (k[p2][a] === code && !(p2 === pl && a === action)) k[p2][a] = old; // swap on conflict
      }
    }
    k[pl][action] = code;
    this.saveSettings();
  };

  // ---------------------------------------------------------------- menus (model)
  const cycle = (list, cur, dir) => {
    let i = list.indexOf(cur);
    if (i < 0) i = 0;
    return list[(i + dir + list.length) % list.length];
  };

  P.menuItems = function () {
    const g = this;
    const s = g.settings;
    const su = s.setup;
    const t = SG.t;
    switch (g.top()) {
      case 'main':
        return [
          { id: 'versus', label: () => t('localVs'), ok: () => g.openSetup('versus') },
          { id: 'cpu', label: () => t('vsCpu'), ok: () => g.openSetup('cpu') },
          { id: 'practice', label: () => t('practice'), ok: () => g.openSetup('practice') },
          { id: 'online', label: () => t('online'), ok: () => g.go('online') },
          { id: 'settings', label: () => t('settings'), ok: () => g.go('settings') },
          { id: 'howto', label: () => t('howTo'), ok: () => { g.howPage = 0; g.go('howto'); } },
          { id: 'credits', label: () => t('credits'), ok: () => g.go('credits') },
        ];
      case 'setup': {
        const items = [];
        const mode = su.mode;
        if (mode === 'cpu') {
          items.push({ id: 'cpuLevel', label: () => t('cpuLevel'), value: () => t('level', su.cpuLevel) + '  ' + t('lvNames')[su.cpuLevel],
            adjust: (d) => { su.cpuLevel = SG.clamp(su.cpuLevel + d, 1, 5); g.saveSettings(); } });
        }
        if (mode === 'practice') {
          const opts = [0, 1, 2, 3, 4, 5, 'human'];
          items.push({ id: 'practiceOpp', label: () => t('opponent'),
            value: () => (su.practiceOpp === 0 ? t('dummy') : su.practiceOpp === 'human' ? t('human') : t('cpu') + ' ' + t('level', su.practiceOpp)),
            adjust: (d) => { su.practiceOpp = cycle(opts, su.practiceOpp, d); g.saveSettings(); } });
        } else {
          items.push({ id: 'winScore', label: () => t('winScore'), value: () => String(su.winScore),
            adjust: (d) => { su.winScore = SG.clamp(su.winScore + d, 1, 10); g.saveSettings(); } });
          items.push({ id: 'bestOf', label: () => t('format'), value: () => (su.bestOf === 1 ? t('single') : t('bestOf', su.bestOf)),
            adjust: (d) => { su.bestOf = cycle([1, 3, 5], su.bestOf, d); g.saveSettings(); } });
          items.push({ id: 'timer', label: () => t('timer'), value: () => (su.timer === 0 ? t('off') : t('seconds', su.timer)),
            adjust: (d) => { su.timer = cycle([0, 60, 90, 120], su.timer, d); g.saveSettings(); } });
        }
        items.push({ id: 'next', label: () => t('chooseStage'), ok: () => g.go('stage') });
        items.push({ id: 'back', label: () => t('back'), ok: () => g.back() });
        return items;
      }
      case 'settings': {
        const onOff = (v) => (v ? t('on') : t('off'));
        const toggle = (key) => () => g.changeSetting(key, !s[key]);
        return [
          { id: 'musicVol', label: () => t('musicVol'), slider: () => s.musicVol, adjust: (d) => g.changeSetting('musicVol', SG.clamp(s.musicVol + d, 0, 10)) },
          { id: 'sfxVol', label: () => t('sfxVol'), slider: () => s.sfxVol, adjust: (d) => { g.changeSetting('sfxVol', SG.clamp(s.sfxVol + d, 0, 10)); g.hooks.sfx('menuMove'); } },
          { id: 'mute', label: () => t('mute'), value: () => onOff(s.mute), adjust: toggle('mute'), ok: toggle('mute') },
          { id: 'battleMusic', label: () => t('battleMusic'), value: () => onOff(s.battleMusic), adjust: toggle('battleMusic'), ok: toggle('battleMusic') },
          { id: 'shake', label: () => t('shake'), value: () => onOff(s.shake), adjust: toggle('shake'), ok: toggle('shake') },
          { id: 'labels', label: () => t('labels'), value: () => onOff(s.labels), adjust: toggle('labels'), ok: toggle('labels') },
          { id: 'scale', label: () => t('display'), value: () => (s.scale === 'fit' ? t('fit') : s.scale + '×'),
            adjust: (d) => g.changeSetting('scale', cycle(['fit', 1, 2], s.scale, d)) },
          { id: 'fullscreen', label: () => t('fullscreen'), value: () => onOff(g.hooks.isFullscreen()),
            adjust: () => g.hooks.toggleFullscreen(), ok: () => g.hooks.toggleFullscreen() },
          { id: 'lang', label: () => t('language'), value: () => (s.lang === 'ja' ? '日本語' : 'English'),
            adjust: (d) => g.changeSetting('lang', cycle(SG.LANGS, s.lang, d)), ok: () => g.changeSetting('lang', cycle(SG.LANGS, s.lang, 1)) },
          { id: 'controls', label: () => t('controls'), ok: () => g.go('controls') },
          { id: 'reset', label: () => t('resetDefaults'), ok: () => g.resetSettings() },
          { id: 'back', label: () => t('back'), ok: () => g.back() },
        ];
      }
      case 'controls': {
        const items = [];
        for (const pl of ['p1', 'p2']) {
          for (const a of ['left', 'right', 'jump']) {
            items.push({ id: pl + a, player: pl, action: a,
              label: () => pl.toUpperCase() + '  ' + t(a === 'left' ? 'moveLeft' : a === 'right' ? 'moveRight' : 'jump'),
              value: () => (g.capture && g.capture.player === pl && g.capture.action === a ? '…' : SG.keyName(s.keys[pl][a])),
              ok: () => { g.capture = { player: pl, action: a }; } });
          }
        }
        items.push({ id: 'resetKeys', label: () => t('resetControls'), ok: () => { s.keys = JSON.parse(JSON.stringify(DEFAULT_KEYS)); g.saveSettings(); } });
        items.push({ id: 'back', label: () => t('back'), ok: () => g.back() });
        return items;
      }
      case 'online':
        return [
          { id: 'create', label: () => t('createRoom'), ok: () => g.requireServer() && g.openSetup('online') },
          { id: 'join', label: () => t('joinRoom'), ok: () => { if (g.requireServer()) { g.joinCode = ''; g.joinCursor = 0; g.go('join'); } } },
          { id: 'back', label: () => t('back'), ok: () => g.back() },
        ];
      case 'lobby': {
        const items = [];
        if (g.net && g.net.phase === 'lobby' && g.net.urls.length) items.push({ id: 'copy', label: () => (g.net.copyMsg ? '✓ ' + t(g.net.copyMsg.key) : t('copyLink')), ok: () => g.copyInviteLink() });
        items.push({ id: 'cancel', label: () => t('cancel'), ok: () => g.cancelLobby() });
        return items;
      }
      case 'pause':
        if (g.session && g.session.online) {
          return [
            { id: 'resume', label: () => t('resume'), ok: () => g.resume() },
            { id: 'settings', label: () => t('settings'), ok: () => g.go('settings') },
            { id: 'leave', label: () => t('leaveMatch'), ok: () => g.quitToMenu() },
          ];
        }
        return [
          { id: 'resume', label: () => t('resume'), ok: () => g.resume() },
          { id: 'restart', label: () => t('restart'), ok: () => g.startMatch() },
          { id: 'settings', label: () => t('settings'), ok: () => g.go('settings') },
          { id: 'menu', label: () => t('mainMenu'), ok: () => g.quitToMenu() },
        ];
      case 'results':
        if (g.session && g.session.online) {
          return [
            { id: 'rematch', label: () => (g.net && g.net.votes[g.net.slot] ? t('waitRematch', g.net.votes.filter(Boolean).length) : t('rematch')), ok: () => g.voteRematch() },
            { id: 'leave', label: () => t('leaveMatch'), ok: () => g.quitToMenu() },
          ];
        }
        return [
          { id: 'rematch', label: () => t('rematch'), ok: () => g.startMatch() },
          { id: 'stage', label: () => t('changeStage'), ok: () => { g.endSession(); g.stack = ['main', 'setup', 'stage']; g.enterScreen(); } },
          { id: 'menu', label: () => t('mainMenu'), ok: () => g.quitToMenu() },
        ];
      default:
        return null;
    }
  };

  P.openSetup = function (mode) {
    this.settings.setup.mode = mode;
    this.cursor.setup = undefined;
    this.go('setup');
  };

  // ---------------------------------------------------------------- match sessions
  P.matchOptions = function () {
    const su = this.settings.setup;
    const practice = su.mode === 'practice';
    return {
      stageId: SG.STAGES[this.stageIndex].id,
      mode: su.mode,
      winScore: practice ? 0 : su.winScore,
      bestOf: practice ? 1 : su.bestOf,
      timeLimit: practice ? 0 : su.timer,
      cpuLevel: su.mode === 'cpu' ? su.cpuLevel : practice && su.practiceOpp !== 'human' ? su.practiceOpp : null,
    };
  };

  P.startMatch = function (seed) {
    const opts = this.matchOptions();
    this.saveSettings();
    this.matchCounter++;
    const aiSeed = seed !== undefined ? seed : (this.hooks.seed ? this.hooks.seed() : this.matchCounter * 7919);
    const world = SG.createWorld(opts);
    const ai = opts.cpuLevel === null || opts.cpuLevel === undefined ? null : SG.createAI(opts.cpuLevel, aiSeed);
    this.session = { opts, world, ai, resultsShown: false, musicStopped: false, aiInput: SG.NO_INPUT };
    this.releaseAll();
    this.stack = ['play'];
    this.focusPaused = false;
    this.enterScreen();
    this.hooks.onMatchStart(this.session);
    this.hooks.sfx('count', { n: 3 });
  };

  P.endSession = function () {
    this.session = null;
  };

  P.quitToMenu = function () {
    const wasOnline = !!(this.net || (this.session && this.session.online));
    this.netClose();
    this.endSession();
    this.releaseAll();
    if (wasOnline) {
      this.stack = ['main', 'online'];
      this.enterScreen();
    } else this.reset('main');
  };

  P.pause = function (focusLost) {
    if (this.top() !== 'play' || !this.session) return;
    if (this.session.world.phase === 'matchEnd') return;
    if (this.session.online) {
      // Online: the server pauses the match for both players; the overlay opens when it confirms.
      if (this.net) this.net.conn.send({ t: 'pause' });
      this.focusPaused = !!focusLost;
      return;
    }
    this.focusPaused = !!focusLost;
    this.hooks.sfx('pause');
    this.go('pause');
  };

  P.resume = function () {
    if (this.top() !== 'pause') return;
    if (this.session && this.session.online) {
      if (this.net) this.net.conn.send({ t: 'resume' });
      return;
    }
    this.focusPaused = false;
    this.back();
    this.hooks.sfx('resume');
  };

  // Which input sources control player i: keyboard set, gamepad slot, touch cluster.
  // In single-player and online modes the one local player may use either set.
  P.humanInput = function (i) {
    const s = this.session;
    const solo = !!(s && (s.ai || s.online));
    const srcs = solo && i === 0 ? [0, 1] : [i];
    const k = this.keys;
    const pr = this.pressed;
    const inp = { left: false, right: false, jumpHeld: false, jumpPressed: false };
    for (const src of srcs) {
      const b = this.settings.keys[src === 0 ? 'p1' : 'p2'];
      const pad = 'Pad' + src;
      const touch = 'Touch' + src;
      const L = [b.left, pad + 'Left', touch + 'Left'];
      const R = [b.right, pad + 'Right', touch + 'Right'];
      const J = [b.jump, pad + 'A', pad + 'B', touch + 'Jump'];
      inp.left = inp.left || L.some((c) => k[c]);
      inp.right = inp.right || R.some((c) => k[c]);
      inp.jumpHeld = inp.jumpHeld || J.some((c) => k[c]);
      inp.jumpPressed = inp.jumpPressed || J.some((c) => pr[c]);
    }
    return inp;
  };

  // Inputs for one local (offline) tick.
  P.localInputs = function (withInput) {
    const s = this.session;
    const w = s.world;
    if (withInput) {
      const i0 = this.humanInput(0);
      const i1 = s.ai ? s.ai.think(w, 1) : this.humanInput(1);
      s.aiInput = s.ai ? i1 : SG.NO_INPUT;
      return [i0, i1];
    }
    if (s.ai) s.ai.think(w, 1);
    return null;
  };

  P.stepMatch = function (inputs) {
    const s = this.session;
    const w = s.world;
    for (const p of w.players) { p.px = p.x; p.py = p.y; }
    for (const pl of w.stage.platforms) { pl.px = pl.x; pl.py = pl.y; }
    SG.stepWorld(w, inputs);
    for (const ev of w.events) this.onWorldEvent(ev);
    this.hooks.onWorldEvents(w.events, s);
    this.hooks.onTick(s);
    if (w.phase === 'matchEnd' && !s.resultsShown && w.phaseTimer >= 20) {
      s.resultsShown = true;
      this.go('results');
    }
  };

  P.onWorldEvent = function (ev) {
    const s = this.session;
    const sfx = this.hooks.sfx;
    switch (ev.type) {
      case 'count': sfx('count', { n: ev.n }); break;
      case 'go': sfx('go'); break;
      case 'roundStart': sfx('count', { n: 3 }); break;
      case 'jump': sfx('jump', { who: ev.who }); break;
      case 'land': if (ev.speed > 2) sfx('land', { who: ev.who, speed: ev.speed }); break;
      case 'bump': sfx('bump'); break;
      case 'stomp': sfx('stomp', { who: ev.top }); sfx('respawn'); break;
      case 'score': {
        const w = s.world;
        const ws = w.opts.winScore;
        const matchPoint = ws > 1 && ev.score === ws - 1 && !w.suddenDeath;
        sfx(matchPoint ? 'matchPoint' : 'score', { who: ev.who });
        break;
      }
      case 'suddenDeath': sfx('suddenDeath'); break;
      case 'roundEnd':
        if (ev.matchOver) {
          s.musicStopped = true;
          this.updateMusic();
          sfx('victory');
        } else sfx('roundWin');
        break;
      default: break;
    }
  };

  // ---------------------------------------------------------------- fixed tick (60 Hz)
  P.tick = function () {
    this.uiTicks++;
    this.screenTicks++;
    if (this.toast && --this.toast.ticks <= 0) this.toast = null;
    if (this.serverHint > 0) this.serverHint--;
    if (this.net && this.net.copyMsg && --this.net.copyMsg.ticks <= 0) this.net.copyMsg = null;
    const top = this.top();
    if (this.net && this.uiTicks % SG.NET.PING_EVERY === 0) this.net.conn.send({ t: 'ping', c: this.hooks.now() });
    if (this.session && this.session.online) this.tickOnline();
    else if (this.session && (top === 'play' || top === 'results')) this.stepMatch(this.localInputs(top === 'play'));
    this.clearPressed();
  };

  // ---------------------------------------------------------------- online (see js/net.js)
  P.requireServer = function () {
    if (this.hooks.netConnect) return true;
    // On the Online screen the instructions are already shown: flash them instead of covering the menu.
    if (this.top() === 'online') this.serverHint = 48;
    else this.toast = { text: SG.t('noServer'), ticks: 150 };
    this.hooks.sfx('back');
    return false;
  };

  P.onlineOpts = function () {
    const o = this.matchOptions();
    return SG.sanitizeOnlineOpts({ stageId: o.stageId, winScore: o.winScore, bestOf: o.bestOf, timeLimit: o.timeLimit });
  };

  // intent: 'create' | 'join'
  P.netOpen = function (intent, code) {
    this.netClose();
    const n = {
      intent, phase: 'connecting', code: code || '', urls: [], slot: -1, rtt: -1,
      votes: [false, false], pausedBy: -1, press: 0, sentPress: 0, lastBits: -1, conn: null, closing: false,
    };
    this.net = n;
    const conn = this.hooks.netConnect
      ? this.hooks.netConnect((msg) => { if (this.net === n) this.onNet(msg); }, () => { if (this.net === n) this.onNetClosed(); })
      : null;
    if (!conn) {
      this.net = null;
      this.requireServer();
      return false;
    }
    n.conn = conn;
    if (intent === 'create') conn.send({ t: 'create', v: SG.NET.PROTOCOL, opts: this.onlineOpts() });
    else conn.send({ t: 'join', v: SG.NET.PROTOCOL, code });
    this.go('lobby');
    return true;
  };

  P.onlineCreate = function () { return this.netOpen('create'); };
  P.onlineJoin = function (code) {
    if (!SG.validRoomCode(code)) return false;
    return this.netOpen('join', code);
  };
  // Opened from a shared link (…/?room=1234).
  P.autoJoin = function (code) {
    if (!SG.validRoomCode(code) || !this.hooks.netConnect) return false;
    this.stack = ['main', 'online', 'join'];
    this.joinCode = code;
    this.enterScreen();
    return this.onlineJoin(code);
  };

  P.netClose = function () {
    const n = this.net;
    if (!n) return;
    this.net = null;
    n.closing = true;
    try {
      n.conn.send({ t: 'leave' });
      n.conn.close();
    } catch (e) {
      /* already closed */
    }
  };

  // Copy the room's invite link (…/?room=1234) so it can be pasted into a chat app.
  P.copyInviteLink = function () {
    const n = this.net;
    if (!n || !n.urls.length) return false;
    const ok = !!this.hooks.copyText(n.urls[0]);
    n.copyMsg = { key: ok ? 'linkCopied' : 'copyFailed', ticks: 150 }; // shown on the button itself
    return ok;
  };

  P.cancelLobby = function () {
    this.netClose();
    if (this.top() === 'lobby') this.back();
  };

  // Connection or room ended unexpectedly: back to the Online menu with a message.
  P.endOnline = function (textKey) {
    this.netClose();
    this.endSession();
    this.releaseAll();
    this.stack = ['main', 'online'];
    this.enterScreen();
    this.toast = { text: SG.t(textKey), ticks: 180 };
    this.hooks.sfx('back');
  };

  P.onNetClosed = function () {
    if (this.net && !this.net.closing) this.endOnline(this.net.phase === 'connecting' ? 'noServer' : 'connLost');
  };

  P.onNet = function (msg) {
    const n = this.net;
    const s = this.session;
    const on = s && s.online;
    switch (msg.t) {
      case 'created':
        n.phase = 'lobby';
        n.code = msg.code;
        n.urls = this.hooks.shareUrls(msg.code, msg.ips || [], msg.port) || [];
        break;
      case 'error': {
        const key = { notFound: 'roomNotFound', full: 'roomFull', version: 'badVersion', busy: 'serverBusy' }[msg.reason] || 'connLost';
        this.netClose();
        if (this.top() === 'lobby') this.back();
        if (this.top() === 'join') this.joinCode = '';
        this.toast = { text: SG.t(key), ticks: 180 };
        this.hooks.sfx('back');
        break;
      }
      case 'start':
        this.startOnlineMatch(msg);
        break;
      case 'f':
        if (!on || !Array.isArray(msg.a)) break;
        for (let k = 0; k < msg.a.length; k++) on.queue.push({ n: msg.n + k, a: msg.a[k] });
        if (msg.h) for (const [hn, hv] of msg.h) on.hashes.set(hn, hv);
        break;
      case 'paused':
        n.pausedBy = msg.by;
        if (s && this.top() === 'play') {
          this.releaseAll();
          this.hooks.sfx('pause');
          this.go('pause');
        }
        break;
      case 'resumed':
        n.pausedBy = -1;
        this.focusPaused = false;
        if (s && this.stack.includes('pause')) {
          this.stack = ['play'];
          this.enterScreen();
          this.hooks.sfx('resume');
        }
        break;
      case 'votes':
        n.votes = msg.votes;
        break;
      case 'state':
        if (on) this.applyServerState(msg);
        break;
      case 'pong':
        if (typeof msg.c === 'number') n.rtt = Math.max(0, this.hooks.now() - msg.c);
        break;
      case 'left':
        this.endOnline('oppLeft');
        break;
      default:
        break;
    }
  };

  P.startOnlineMatch = function (msg) {
    const n = this.net;
    const opts = SG.sanitizeOnlineOpts(msg.opts);
    const world = SG.createWorld(opts);
    this.session = {
      opts, world, ai: null, resultsShown: false, musicStopped: false, aiInput: SG.NO_INPUT,
      online: { slot: msg.you, queue: [], history: [], hashes: new Map(), started: false, n: 0, stalls: 0, desyncs: 0, resyncs: 0 },
    };
    n.phase = 'match';
    n.slot = msg.you;
    n.code = msg.code || n.code;
    n.votes = [false, false];
    n.pausedBy = -1;
    this.releaseAll();
    this.stack = ['play'];
    this.focusPaused = false;
    this.enterScreen();
    this.hooks.onMatchStart(this.session);
    this.hooks.sfx('count', { n: 3 });
  };

  P.voteRematch = function () {
    if (!this.net) return;
    this.net.votes[this.net.slot] = true;
    this.net.conn.send({ t: 'rematch' });
  };

  P.tickOnline = function () {
    const s = this.session;
    const on = s.online;
    const n = this.net;
    if (!n) return;
    // 1) send this device's input (nothing is held while a menu is open over the match)
    const inp = this.top() === 'play' ? this.humanInput(0) : SG.NO_INPUT;
    if (inp.jumpPressed) n.press++;
    const bits = SG.packHeld(inp);
    if (bits !== n.lastBits || n.press !== n.sentPress) {
      n.conn.send({ t: 'in', b: bits, p: n.press });
      n.lastBits = bits;
      n.sentPress = n.press;
    }
    // 2) play the server's frames, keeping a small buffer against network jitter
    const NET = SG.NET;
    const q = on.queue;
    if (!on.started && q.length >= NET.START_BUFFER) on.started = true;
    let k = 0;
    if (on.started) {
      if (q.length > NET.FAST_FORWARD) k = q.length - NET.START_BUFFER;
      else if (q.length > NET.CATCH_UP) k = 2;
      else k = Math.min(1, q.length);
      if (q.length === 0 && s.world.phase !== 'matchEnd') {
        on.started = false; // ran dry: rebuild the buffer
        if (n.pausedBy < 0) on.stalls++;
      }
    }
    for (let j = 0; j < k && this.session === s; j++) this.applyFrame(q.shift());
    if (k === 0 && this.session === s) {
      const w = s.world;
      for (const p of w.players) { p.px = p.x; p.py = p.y; }
      for (const pl of w.stage.platforms) { pl.px = pl.x; pl.py = pl.y; }
      if (w.phase === 'matchEnd') this.hooks.onTick(s); // keep the celebration animating
    }
  };

  P.applyFrame = function (f) {
    const s = this.session;
    const on = s.online;
    if (f.n <= on.n) return;
    on.n = f.n;
    this.stepMatch([SG.unpackInput(f.a[0]), SG.unpackInput(f.a[1])]);
    on.history.push(f);
    if (on.history.length > 600) on.history.splice(0, on.history.length - 600);
    const h = on.hashes.get(f.n);
    if (h !== undefined) {
      on.hashes.delete(f.n);
      if (SG.hashWorld(s.world) !== h) {
        on.desyncs++;
        if (this.net) this.net.conn.send({ t: 'resync' });
      }
    }
  };

  // Replace the local world by the server's copy, then replay frames already played after it.
  P.applyServerState = function (msg) {
    const s = this.session;
    const on = s.online;
    const w = msg.w;
    if (!w || !w.players || !w.stage) return;
    w.events = [];
    if (msg.n >= on.n) {
      // we were behind: skip straight to the server's tick
      on.n = msg.n;
      on.queue = on.queue.filter((f) => f.n > msg.n);
    } else {
      for (const f of on.history) {
        if (f.n > msg.n) SG.stepWorld(w, [SG.unpackInput(f.a[0]), SG.unpackInput(f.a[1])]);
      }
    }
    w.events = [];
    for (const p of w.players) { p.px = p.x; p.py = p.y; }
    for (const pl of w.stage.platforms) { pl.px = pl.x; pl.py = pl.y; }
    s.world = w;
    on.resyncs++;
  };

  // ---------------------------------------------------------------- input
  P.keyDown = function (code, repeat) {
    if (code === 'F1') {
      if (!repeat) this.debug = !this.debug;
      return;
    }
    if (this.capture) {
      if (repeat) return;
      if (isVirtual(code)) {
        // controllers and touch buttons are fixed; B cancels the rebind
        if (/^Pad[01]B$/.test(code)) { this.hooks.sfx('back'); this.capture = null; }
        return;
      }
      if (code === 'Escape') this.hooks.sfx('back');
      else if (!RESERVED_KEYS.includes(code)) {
        this.bindKey(this.capture.player, this.capture.action, code);
        this.hooks.sfx('select');
      }
      this.capture = null;
      return;
    }
    const top = this.top();
    if (top === 'play') {
      if (isPauseKey(code)) {
        if (!repeat) this.pause(false);
        return;
      }
      if (!this.keys[code] && !repeat) this.pressed[code] = true;
      this.keys[code] = true;
      return;
    }
    this.keys[code] = true;
    if (top === 'join' && this.joinScreenKey(code, repeat)) return;
    this.menuKey(code, repeat);
  };

  P.keyUp = function (code) {
    this.keys[code] = false;
  };

  P.blur = function () {
    this.releaseAll();
    if (this.top() === 'play' && this.session && this.session.world.phase !== 'matchEnd') this.pause(true);
  };

  // Join Room screen: digits type the code; arrows / D-pad move over the on-screen keypad.
  P.joinScreenKey = function (code, repeat) {
    const m = DIGIT_RE.exec(code);
    if (m) { this.joinKey(m[1]); return true; }
    if (code === 'Backspace') { if (!repeat) this.joinKey('del'); return true; }
    if ((code === 'Enter' || code === 'NumpadEnter') && this.joinCode.length === SG.NET.CODE_LEN) {
      if (!repeat) this.joinKey('ok');
      return true;
    }
    const nav = navOf(code);
    if (!nav) return true;
    const c = this.joinCursor;
    if (nav === 'left') this.joinCursor = c % 3 === 0 ? c + 2 : c - 1;
    else if (nav === 'right') this.joinCursor = c % 3 === 2 ? c - 2 : c + 1;
    else if (nav === 'up') this.joinCursor = (c + 9) % 12;
    else if (nav === 'down') this.joinCursor = (c + 3) % 12;
    else if (nav === 'ok') { if (!repeat) this.joinKey(SG.JOIN_KEYS[c]); return true; }
    else if (nav === 'back') { if (!repeat) { this.hooks.sfx('back'); this.back(); } return true; }
    this.hooks.sfx('menuMove');
    return true;
  };

  P.joinKey = function (key) {
    if (this.top() !== 'join') return;
    const i = SG.JOIN_KEYS.indexOf(key);
    if (i >= 0) this.joinCursor = i;
    if (/^[0-9]$/.test(key)) {
      if (this.joinCode.length < SG.NET.CODE_LEN) { this.joinCode += key; this.hooks.sfx('menuMove'); }
    } else if (key === 'del') {
      if (this.joinCode.length) { this.joinCode = this.joinCode.slice(0, -1); this.hooks.sfx('back'); }
    } else if (key === 'ok') {
      if (this.joinCode.length === SG.NET.CODE_LEN) { this.hooks.sfx('select'); this.onlineJoin(this.joinCode); }
      else this.hooks.sfx('back');
    }
  };

  P.menuKey = function (code, repeat) {
    const g = this;
    const top = g.top();
    const nav = navOf(code);
    if (!nav) return;
    if (top === 'lobby' && nav === 'back') {
      if (!repeat) { g.hooks.sfx('back'); g.cancelLobby(); }
      return;
    }
    // Results appear while players may still be mashing keys: ignore input for half a second.
    if (top === 'results' && g.screenTicks < OVERLAY_LOCK_TICKS) return;
    if (top === 'title') {
      if (nav === 'ok' && !repeat) { g.hooks.sfx('start'); g.go('main', true); }
      return;
    }
    if (top === 'howto') {
      const n = SG.t('howPages').length;
      if (nav === 'left' || nav === 'up') { if (g.howPage > 0) { g.howPage--; g.hooks.sfx('menuMove'); } }
      else if (nav === 'right' || nav === 'down' || nav === 'ok') {
        if (g.howPage < n - 1) { g.howPage++; g.hooks.sfx('menuMove'); }
        else if (nav === 'ok') { g.hooks.sfx('back'); g.back(); }
      } else if (nav === 'back') { g.hooks.sfx('back'); g.back(); }
      return;
    }
    if (top === 'credits') {
      if ((nav === 'back' || nav === 'ok') && !repeat) { g.hooks.sfx('back'); g.back(); }
      return;
    }
    if (top === 'stage') {
      const n = SG.STAGES.length;
      if (nav === 'left' || nav === 'up') { g.stageIndex = (g.stageIndex - 1 + n) % n; g.hooks.sfx('menuMove'); g.saveSettings(); }
      else if (nav === 'right' || nav === 'down') { g.stageIndex = (g.stageIndex + 1) % n; g.hooks.sfx('menuMove'); g.saveSettings(); }
      else if (nav === 'ok' && !repeat) {
        g.hooks.sfx('select');
        if (g.settings.setup.mode === 'online') g.onlineCreate();
        else g.startMatch();
      }
      else if (nav === 'back' && !repeat) { g.hooks.sfx('back'); g.back(); }
      return;
    }
    const items = g.menuItems();
    if (!items) return;
    let i = g.cursor[top] || 0;
    if (nav === 'up' || nav === 'down') {
      i = (i + (nav === 'up' ? -1 : 1) + items.length) % items.length;
      g.cursor[top] = i;
      g.hooks.sfx('menuMove');
    } else if (nav === 'left' || nav === 'right') {
      const it = items[i];
      if (it.adjust) { it.adjust(nav === 'left' ? -1 : 1); if (it.id !== 'sfxVol') g.hooks.sfx('menuMove'); }
    } else if (nav === 'ok') {
      if (repeat) return;
      const it = items[i];
      if (it.ok) { g.hooks.sfx(it.id === 'back' ? 'back' : 'select'); it.ok(); }
    } else if (nav === 'back') {
      if (repeat) return;
      g.hooks.sfx('back');

  // Pointer support: select/activate a menu row by index.

    const VH = C.VIEW_H;

      b.push({ code: 'Touch0Left', x: 46, y, r: 27, icon: 'left', who: 0 });
      b.push({ code: 'Touch0Right', x: 112, y, r: 27, icon: 'right', who: 0 });
      b.push({ code: 'Touch0Jump', x: 190, y, r: 30, icon: 'jump', who: 0 });
      b.push({ code: 'Touch1Jump', x: VW - 190, y, r: 30, icon: 'jump', who: 1 });
      b.push({ code: 'Touch1Left', x: VW - 112, y, r: 27, icon: 'left', who: 1 });
      b.push({ code: 'Touch1Right', x: VW - 46, y, r: 27, icon: 'right', who: 1 });
    } else {
      b.push({ code: 'Touch0Left', x: 56, y: VH - 42, r: 36, icon: 'left', who: 0 });
      b.push({ code: 'Touch0Right', x: 146, y: VH - 42, r: 36, icon: 'right', who: 0 });
      b.push({ code: 'Touch0Jump', x: VW - 72, y: VH - 46, r: 42, icon: 'jump', who: 0 });

  // ---------------------------------------------------------------- key names
  const NAMES = {
    ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'Space', Enter: 'Enter',
    ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl',
    AltLeft: 'L-Alt', AltRight: 'R-Alt', Backspace: 'Backspace', Tab: 'Tab', Slash: '/', Period: '.',
    Comma: ',', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Minus: '-', Equal: '=',
    Backslash: '\\', Backquote: '`',
  };
  SG.keyName = function (code) {
    if (!code) return '—';
    if (NAMES[code]) return NAMES[code];
    if (code.startsWith('Key')) return code.slice(3);
    if (code.startsWith('Digit')) return code.slice(5);
    if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
