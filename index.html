<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stomp Duel — 2D Action Versus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='8' width='24' height='22' rx='9' fill='%23ea3f3a' stroke='%233a0b10' stroke-width='2'/%3E%3Ccircle cx='13' cy='17' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='17' r='3' fill='%23fff'/%3E%3Cpath d='M10 9 Q12 2 16 4 Q18 0 22 3 L22 9 Z' fill='%23ffb43c'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0c1e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); background: #000;
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  noscript { color: #fff; font-family: sans-serif; }
</style>
</head>
<body>
<canvas id="game" width="800" height="400" tabindex="0" aria-label="Stomp Duel game"></canvas>
<noscript>This game needs JavaScript enabled.</noscript>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/stages.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/fighter.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
  // If the js/ folder is missing (e.g. index.html opened alone or from inside a ZIP), explain instead of a blank page.
  if (!(window.SG && window.SG.Game && window.game instanceof window.SG.Game)) {
    document.body.innerHTML = '<div style="color:#fff;font:16px/1.6 sans-serif;max-width:640px;padding:24px">' +
      '<h2>Stomp Duel could not load its files</h2>' +
      '<p>The <b>js</b> folder next to index.html is missing. If you downloaded a ZIP, right-click it → <b>Extract All</b>, ' +
      'then open index.html from the extracted folder. Or open <b>StompDuel.html</b>, which works on its own.</p>' +
      '<p>ゲームのファイルを読み込めませんでした。ZIP の場合は「すべて展開」してから index.html を開くか、' +
      '単体で動く <b>StompDuel.html</b> を開いてください。</p></div>';
  }
</script>
</body>
</html>
